# pnpm settings (since pnpm 10/11 no longer in the "pnpm" field of package.json).
# Native postinstall builds are blocked by default for security reasons;
# the packages Vite/Tailwind need are allowed explicitly here.
allowBuilds:
  # false: the postinstall only fetches the sentry-cli binary, which uploads source maps
  # — not done here. GlitchTip does not accept uploads, and it could not fetch them from
  # behind the auth proxy either. @sentry/sveltekit works fully without it.
  '@sentry/cli': false
  '@tailwindcss/oxide': true
  esbuild: true
