# pnpm settings (since pnpm 10/11 no longer in the "pnpm" field of package.json).
# Native postinstall builds are blocked by default for security reasons;
# the packages Vite/Tailwind need are allowed explicitly here.
allowBuilds:
  # false: the postinstall only fetches the sentry-cli binary, which uploads source maps
  # — not done here. GlitchTip does not accept uploads, and it could not fetch them from
  # behind the auth proxy either. @sentry/sveltekit works fully without it.
  '@sentry/cli': false
  '@tailwindcss/oxide': true
  esbuild: true

# Security overrides, each for a Dependabot alert that no release of the parent fixes.
# Scoped to the one parent, so nothing else is moved. Remove an entry once its parent ships
# the fix on its own.
overrides:
  # GHSA-rj75-hqrm-r3gf. @tailwindcss/typography 0.5.20 (latest) pins exactly 6.0.10.
  '@tailwindcss/typography>postcss-selector-parser': ^6.1.5
  # GHSA-g3hv-75wg-m249. graphql-config 5.x and 6.0 both ask for minimatch ^10; the fix is
  # only in 11. Used by `pnpm codegen` for its document globs, so a codegen run covers it.
  'graphql-config>minimatch': ^11.0.1

# One-line fix for sveltejs/kit#17500: capture_scroll throws when a history entry has no
# record (back/forward into an entry made by an earlier document, an iOS reload), which
# leaves the client router stuck until a reload. Remove once a Kit release contains the
# upstream fix; pnpm refuses to install when the patch no longer applies to a new version.
patchedDependencies:
  '@sveltejs/kit@3.4.0': patches/@sveltejs__kit@3.4.0.patch
