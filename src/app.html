<!doctype html>
<!--
	hooks.server.ts substitutes data-theme from the cookie. A placeholder for the whole attribute
	and not just for the value: with the "System" choice it has to disappear entirely, or the
	--default/--prefersdark themes from app.css do not apply.
-->
<html lang="de" %tallox.themeattr%>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!-- The fallback title. Pages override it with <svelte:head>, but without one here any
		     page that forgets would have none at all — and a document without a <title> is a WCAG
		     violation (2.4.2) and unfindable in a bar full of tabs.
		     It stands before the head insertion below so that a page's own title wins.

		     CAUTION: never mention a sveltekit placeholder in the prose of a comment in this
		     file. The substitution hits the FIRST occurrence — it would strike here, write the
		     stylesheet into the comment and leave the real placeholder further down as visible
		     text. -->
		<title>Tallox — Einsatzplanung FK07</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
