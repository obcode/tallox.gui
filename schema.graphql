"""
Directs the executor to defer this fragment when the `if` argument is true or undefined.
"""
directive @defer(
  """Deferred when true or undefined."""
  if: Boolean = true

  """Unique name"""
  label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

"""
Marks a field that only answers in a signed-in browser session, never through a Personal
Access Token.

**On a nullable field you get `null`**, and the rest of your query still answers — so a script
that asks for something interactive-only alongside other fields keeps the other fields. On a
field that cannot be null, and on every mutation, the call is refused with the error code
`INTERACTIVE_ONLY`.

Behind it: teaching load and overtime, other people's unpublished wishes, free-text notes
about people, the audit log, token management itself, and every mutation that writes the demand.
A long-lived token in a script is a different risk from a login: it makes silent bulk export
possible and separates "who saw this" from any sign-in. Token management is on the list because a
leaked token that can mint its successors would outlive its own expiry date.

Writing the demand is on it for a less obvious reason, and it is worth reading once: a withdrawal
refused with `INSTANCE_IN_USE` is an answer about wishes. Interactively that gives nothing away —
whoever may write a programme's demand may already read its unpublished wishes — but through a
token the wish rule reaches only your own, so a dry-run plan would have been a free, traceless
enumeration of which instances somebody wants. See the note at the top of `demand.graphqls`.
"""
directive @interactiveOnly on FIELD_DEFINITION

"""
Indicates exactly one field must be supplied and this field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

"""
Which Personal Access Token scope a field requires.

Every field on `Query` and `Mutation` carries one. A token whose scope list does not cover
every root field of your operation is refused with the error code `INSUFFICIENT_SCOPE`, before
anything runs.

A fetched schema will not show you the annotations — introspection reports that this directive
exists, but not where it is applied. Each `ScopeArea` below therefore lists the fields that
belong to it.

Two things worth knowing before you mint a token:

- **`WRITE` includes `READ` in the same area**, and nowhere else. There is no scope that covers
  all areas; a token that needs several lists several.
- **A token with an empty scope list is not restricted** — it may do everything its owner's
  roles allow. Scopes only ever narrow, exactly like the role preview does.

A scope never widens anything. Your roles decide what you may see; the scope decides how much
of that this particular token may reach.
"""
directive @scope(
  """Which part of the API the field belongs to."""
  area: ScopeArea!

  """Whether reaching the field is a read or a change."""
  verb: ScopeVerb!
) on FIELD_DEFINITION

"""Exposes a URL that specifies the behavior of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behavior of this scalar."""
  url: String!
) on SCALAR

"""The headline figures of one window."""
type AccessCounts {
  """Every entry in the window, refusals included."""
  total: Int!

  """Operations through the browser door."""
  interactive: Int!

  """Operations through the Personal Access Token door."""
  token: Int!

  """Operations that changed something."""
  mutations: Int!

  """Operations that ran and failed."""
  errors: Int!

  """Sign-ins that were refused before reaching the schema."""
  refusedAuth: Int!

  """Operations refused because the token's scopes did not cover them."""
  refusedScope: Int!

  """
  Operations refused because a token reached for an interactive-only field.
  """
  refusedInteractive: Int!

  """
  How many distinct people appear. Refused sign-ins have no person and are not counted here —
  they are counted by `refusedAuth`, and named in `refused`.
  """
  people: Int!
}

"""
Why somebody sees what they see.

Answers with decisions, never with content: it says whether a rule lets this person past, and
it never reads the thing behind the rule. That is what makes it usable for the ordinary
support question — "why can my colleague not see this" — without becoming a way around the
confidentiality it is describing.
"""
type AccessDiagnosis {
  """The person the diagnosis is about."""
  person: Person!

  """
  An inactive person fails authentication on both doors, whatever roles they hold.
  """
  active: Boolean!

  """Their grants, expired ones included."""
  grants: [RoleGrant!]!

  """What the rules answer for this person, one entry per rule."""
  decisions: [PolicyDecision!]!
}

"""Which mount a request came through."""
enum AccessDoor {
  """A person in a browser, behind the authentication proxy."""
  INTERACTIVE

  """A Personal Access Token: a script, a notebook, a cron job."""
  TOKEN
}

"""
One entry: one operation, or one sign-in that was refused before there was an operation.
"""
type AccessLogEntry {
  id: ID!

  """When it happened."""
  at: Time!

  """
  The person this was, when the request had one. `null` for a refused sign-in — which is
  precisely the case worth looking at, because it is somebody this installation does not know.
  
  An id and a name rather than a `Person`. A `Person` carries `roles` and `active` as they are
  **now**, and putting one on a log entry would place today's answer next to a record of what
  was true at the time — which is the one confusion this whole table is built to avoid. Follow
  the id to `person(id:)` to ask about today.
  """
  personId: ID

  """
  The person's name as it stands today, `null` when there is no person row. A rendering
  convenience, resolved through a join; the entry's own record of who this was is `mail`.
  """
  personName: String

  """The identity as asserted, whether or not it resolved to a person."""
  mail: String

  """Which mount the request came through."""
  door: AccessDoor!

  """
  The public half of the Personal Access Token used, `null` for the browser door.
  
  The same value the owner sees in their token list, so an entry can be matched to a token
  without the token itself appearing anywhere.
  """
  tokenId: String

  """
  The roles the request was actually judged by.
  
  The effective set: a session that was narrowed counts under what it was narrowed to, which is
  the honest reading of what the rules saw.
  """
  roles: [Role!]!

  """
  The roles as held, when and only when the caller asked to be narrowed. `null` otherwise.
  """
  narrowedFrom: [Role!]

  """
  The operation name from the document. Client-supplied: a label, never a key.
  """
  operation: String

  """
  The root fields the operation asked for. See the note at the top of this file.
  """
  fields: [String!]!

  """Whether the operation changed data."""
  mutation: Boolean!

  """How it ended."""
  outcome: AccessOutcome!

  """
  The error code of the first error, `null` when there was none — `INSUFFICIENT_SCOPE`,
  `INTERACTIVE_ONLY`, `UNKNOWN_USER`.
  
  The code and never the message: the German sentences get reworded, and a log that stored them
  would be a second place they have to match.
  """
  errorCode: String

  """How long the operation took, in milliseconds."""
  durationMs: Int

  """
  Where the request came from, `null` when it could not be determined.
  
  A stolen credential is recognised by where it is used and by nothing else, which is the only
  reason this is recorded at all.
  """
  sourceIp: String
}

"""
Narrows a page of the log. Everything is optional; omitting all of it means the whole log,
newest first.
"""
input AccessLogFilter {
  """One person, by id."""
  personId: ID

  """
  A substring of the mail address — for the support question that starts with half an address.
  """
  mail: String

  """One door — the browser or a Personal Access Token."""
  door: AccessDoor

  """Only entries that did not end in `OK`."""
  onlyRefused: Boolean

  """Only entries that changed something."""
  onlyMutations: Boolean

  """Only entries at or after this moment."""
  from: Time

  """Only entries strictly before this moment."""
  until: Time
}

"""One root field somebody changed something with, and how often."""
type AccessMutationCount {
  """Who changed something."""
  mail: String!

  """The root field they changed it with."""
  field: String!

  """How often, over the window."""
  calls: Int!

  """The most recent call."""
  lastAt: Time!
}

"""
How a request ended.

Three kinds of refusal rather than one, because they are three different events with three
different answers. A refused sign-in is somebody who cannot get in at all. A scope refusal is a
colleague's script asking for something its token was not minted for, and the fix is a new
token. An interactive-only refusal is a script reaching for personnel data, and the fix is not a
new token — it is the person, in a browser.
"""
enum AccessOutcome {
  """The operation ran and returned no error."""
  OK

  """The operation ran and failed."""
  ERROR

  """
  The request never reached the schema: an unknown identity, a deactivated person, an expired or
  revoked token. The only outcome that appears without a person.
  """
  REFUSED_AUTH

  """The token's scopes did not cover what the operation asked for."""
  REFUSED_SCOPE

  """
  A token reached for a field that is available only in an interactive session.
  """
  REFUSED_INTERACTIVE
}

"""How much happened under one effective role."""
type AccessRoleCount {
  """The effective role the operations were judged by."""
  role: Role!

  """How many operations ran under it."""
  operations: Int!
}

"""
What happened in one window.

The same type the nightly report is built from, so the page and the mail cannot come to
different conclusions about the same night.
"""
type AccessSummary {
  """The start of the window, inclusive."""
  from: Time!

  """
  The end of the window, exclusive — so two consecutive windows cannot count the same entry.
  """
  until: Time!

  """The headline figures."""
  counts: AccessCounts!

  """How much happened under each effective role."""
  roles: [AccessRoleCount!]!

  """
  The sign-ins that never got in. This is the part that names people, and it names them because
  being turned away is itself the event worth reporting.
  """
  refused: [RefusedSignIn!]!

  """Everything that was changed, by whom and with which root field."""
  mutations: [AccessMutationCount!]!
}

"""
Whoever holds a part: a colleague with a Tallox account, or somebody from the examination
office's list who has none.

Exactly one of `person` and `teacher` is set, and `name` is filled from whichever it is — so a
screen rendering a row does not have to know which. That is a fact about accounts, not about
teaching.

**Somebody without an account is not a lesser assignee.** Lecturers on contract and colleagues
from other institutions are planned here like anybody else; six of the teachers the examination
office knows carry addresses this faculty's identity provider will never assert. What follows from
having no account is only that such a row is nobody's "own" for the visibility rule.
"""
type Assignee {
  """
  The Tallox account holding this part, or `null` when it is held by somebody who has none.
  
  When a teacher who does hold an account is assigned, this is what gets stored — the assignment
  is canonicalised on the way in, so that the same colleague is never two identities in this table
  and `myAssignments` cannot find half of what they teach.
  """
  personId: ID

  """
  The examination office's record, or `null` when the assignment names an account directly.
  Resolve it through `teachers` when a screen needs more than the name.
  """
  teacherId: ID

  """What to show. From whichever of the two is set."""
  name: String!

  """
  The address, or `null` for the few teachers who carry none.
  
  The same address that makes a `Teacher` and a `Person` one human being.
  """
  mail: String
}

"""One person holding one part of one course instance."""
type Assignment {
  id: ID!

  """
  The part that is held: which kind, which of several laboratory groups, and what it is worth in
  teaching hours.
  
  `part.teachingHours` is what **one lecturer** is credited with — not what a student attends
  (`Module.contactHoursPerWeek`) and not the canonical split (`ModuleComponent.teachingHours`).
  Three quantities that could all be called SWS, which is why they are named differently.
  """
  part: InstancePart!

  """
  The instance the part belongs to: one module, in one study programme, for one cohort.
  
  Carried in full because an assignment is unreadable without it. "Analysis, IF1B, Praktikum 2" is
  the row somebody recognises; an id is not. Its `parts` are not populated here — this is one row
  per assignment, and loading them would be one row per part to carry a figure that is already on
  `part`.
  """
  instance: CourseInstance!

  """Who holds it."""
  assignee: Assignee!

  """
  What the deciding person wanted recorded: "vertretungsweise", "nur im ersten Halbsemester".
  
  Read by whoever may read the assignment, which is the same rule as the row.
  """
  note: String!

  """
  Who decided, or `null` once that person's row is gone.
  
  The field a wish deliberately does not have. An assignment is always somebody's decision about
  somebody else — that is what distinguishes the two — so its provenance belongs on the row.
  
  An id for the reason `Assignee` carries ids: this is provenance, and it should not be the route
  by which a screen learns what roles somebody holds.
  """
  assignedById: ID

  """When the part was first filled."""
  createdAt: Time!

  """
  When it last changed. Handing the part to somebody else moves this and keeps `createdAt`: the
  part has been staffed since then, and by whom is what changed.
  """
  updatedAt: Time!
}

"""A sibling cohort's shared part, seen from the cohort it is held for."""
type BorrowedPart {
  """The part itself, as its owning cohort holds it."""
  part: InstancePart!

  """
  The cohort that owns the row — the A in "held together with IF3A".
  
  Empty is possible and means the sibling has no letter, which happens while somebody is in the
  middle of splitting a single cohort into two. Where `fromProgramme` is set, this is that
  programme's cohort letter rather than one of this instance's siblings.
  """
  fromTrack: String!

  """
  The study programme that holds it, where that is another one — and `null` where it is this
  cohort's own, which is the sibling-cohort case and the ordinary one.
  
  Set when this instance's demand is covered by another programme's event: the covered cohort
  holds nothing at all and attends everything the holding cohort holds. Both kinds are one list
  because a cohort attending teaching it does not own is one fact, and a second list would be a
  second way to look like a planning mistake.
  """
  fromProgramme: Programme
}

"""Version and provenance of the running server instance."""
type BuildInfo {
  """Semantic version from the release tag, or `dev` in a local build."""
  version: String!

  """Git commit the binary was built from, or `none`."""
  commit: String!

  """Build timestamp in RFC 3339, or `unknown`."""
  builtAt: String!
}

"""
One unit of a split nobody has stated yet.

Separate from `ModuleComponent` because it has no id: there is no row to point at, and there is
nothing to edit. It is what the software would enter if asked, and it is shown as such.
"""
type ComponentProposal {
  """What kind of teaching this unit would be."""
  kind: InstancePartKind!

  """Hours per week for one unit of this kind."""
  teachingHours: Float!
}

"""
What copying a semester's demand did.

Reported even when nothing happened. A copy into a semester that already holds the same instances
writes nothing at all, and "nothing happened" is indistinguishable from "it failed" to the person
who pressed the button.
"""
type CopyDemandReport {
  """The semester copied from."""
  from: String!

  """The semester copied into."""
  to: String!

  """The study programme whose demand was copied."""
  programme: Programme!

  """How many instances were declared."""
  created: Int!

  """
  How many were already declared in the target and were left exactly as they are.
  
  A copy never overwrites work in the semester it copies into — including a cohort year somebody
  has since corrected there.
  """
  skipped: Int!

  """How many parts came with the new instances."""
  partsCreated: Int!

  """
  How many copied cohorts asked again to be covered by another study programme's event.
  
  Asked, never agreed: the other programme's lead agreed about *that* semester, and an agreement
  carried forward automatically would be a decision nobody made. The request is carried because
  dropping it would leave a cohort whose teaching silently reappeared.
  """
  coverageRequested: Int!

  """
  How many copied cohorts were covered in the source semester and found nothing to ask in the
  target, because the holding programme has not declared the module there yet.
  
  They arrive with **no parts at all**, which is why this is counted rather than left silent.
  Building parts from the module's split instead would invent teaching at the press of a button.
  """
  coverageNotPossible: Int!

  """
  The demand of the target semester afterwards — the whole list, not only the new rows.
  
  So that a screen can render the result of the copy from the answer to the copy, rather than
  asking again and rendering a moment that is one round trip old.
  """
  instances: [CourseInstance!]!
}

"""
One module, offered in one semester, for one study programme, to one parallel cohort.

**This is what gets planned, and its parts are what get assigned.** The faculty's own sentence is
"one person holds the lecture, another the laboratory", so a wish and an assignment will point at
an `InstancePart` and never at the instance.

The identity is the semester, the module, the programme and the cohort. Two things are
deliberately not part of it:

* **The version of the examination regulations.** One lecture in the winter serves every valid
  version at once — students under IF-2019 and IF-2025 sit in the same room with the same
  person — so an instance per version would be the same event two to four times in every list.
  Where the version matters, it is a question about `Module.offerings`.
* **The kind of teaching.** A lecture and its laboratories are one instance with several parts,
  not several instances.

The cohort *is* part of it, and that is the one people are surprised by. An instance is normally
assigned to one person, and Software Engineering I runs in two cohorts held by two people — so if
the cohort were a multiplicity inside the instance, "assign IF3A to somebody" would not be a
sentence this schema could express.
"""
type CourseInstance {
  id: ID!

  """
  The semester, in this system's spelling: `2026-WS`.
  
  The year is the one the semester *starts* in, so the winter of 2026/27 is `2026-WS`.
  """
  semester: String!

  """
  Whose demand this is.
  
  Not necessarily the module's home programme. A module at home in one programme and offered by
  another is exactly what the dean's office's import/export figures are about, and the difference
  between the two declarations is the export.
  """
  programme: Programme!

  """
  The catalogue entry this is an offering of, with its split and its offerings attached.
  
  The same `Module` the catalogue serves, so that "is this compulsory here" and "how do its hours
  divide" are answerable on a demand screen without a second lookup.
  """
  module: Module!

  """
  The parallel cohort — the A in IF3A — and empty for a module that runs once, which is the
  ordinary case.
  
  The letter only. The label a person reads is the programme's code, the cohort year and this,
  assembled where they are read: storing the assembled string would denormalise two facts and go
  stale on the third.
  """
  track: String!

  """
  Which cohort year this is for — the 3 in IF3A — or `null` where nobody has said and the
  regulations do not either.
  
  Seeded from the regulations when the instance is declared and a decision afterwards, rather
  than derived on every read. Derived it would be a *set* rather than a number: 23 of 1076
  module/programme pairs disagree across versions of the regulations, and it would change
  retroactively when a new version lands, renaming a cohort that has already been taught.
  """
  programmeSemester: Int

  """
  The assignable units this cohort holds itself, in order.
  
  Made from the module's split when the instance is declared — one part per unit — and edited
  afterwards. The number of laboratory *groups* is a planning decision and lives here, not in the
  module: a two-hour laboratory in the split is one entry however many groups a cohort runs.
  
  Empty where `coveredBy` is accepted: another programme holds this cohort's teaching, and what it
  attends is in `borrowedParts` instead.
  """
  parts: [InstancePart!]!

  """
  Parts of a sibling cohort that are held for this one as well.
  
  The other half of `InstancePart.sharedAcrossTracks`. A lecture given once for IF3A and IF3B is
  one row, owned by one of them — and the other has to render it, or its screen shows a cohort
  with laboratories and no lecture and looks like a planning mistake.
  
  Never counted in `teachingHours`: the point of holding a lecture once is that it costs the
  faculty once.
  """
  borrowedParts: [BorrowedPart!]!

  """
  The other study programme's instance that holds this one's teaching, or `null` — which is the
  ordinary case.
  
  Once `acceptedAt` is set this cohort holds no parts of its own: `parts` is empty, everything it
  attends is in `borrowedParts`, and `teachingHours` is `0`. That zero is the point rather than a
  gap — the event is held once and costs the faculty once, at the programme that holds it.
  """
  coveredBy: InstanceCoverage

  """
  The other study programmes' demands this instance meets, asked and agreed.
  
  A request nobody has answered appears here with `acceptedAt: null`. This is the side where it is
  answered, so leaving it out would hide the only thing that needs doing.
  """
  covers: [InstanceCoverage!]!

  """
  What this instance costs the faculty: the sum over the parts it holds.
  
  **Not the module's own `contactHoursPerWeek`**, which is what a student attends. A four-hour
  module running one lecture and three laboratory groups costs eight hours per cohort, and
  summing the module's figure would give four — a plausible-looking wrong answer.
  
  A part whose hours nobody has stated yet contributes nothing rather than making the sum
  unanswerable: an instance can be declared before the detail is settled, which is what a demand
  deadline that comes before the detail requires.
  
  `0` for a cohort whose demand is covered by another programme, and that is a statement rather
  than a gap: it holds no teaching, so it costs nothing, and the event it attends is counted once
  at the programme that holds it.
  """
  teachingHours: Float!

  """When this instance was declared."""
  createdAt: Time!

  """When it was last changed."""
  updatedAt: Time!
}

"""
How the teaching of a module is broken up, as the catalogue describes it.

The template a module's split is proposed from, and nothing more: it does not say how the hours
divide and it does not say how many parallel groups there are. The first is stated once per
module in `ModuleComponent`; the second is decided per instance.
"""
enum CourseType {
  """
  Seminar-style teaching with a laboratory. The largest group in the catalogue.
  """
  SU_WITH_LAB

  """Seminar-style teaching with an exercise class."""
  SU_WITH_EXERCISE

  """A seminar."""
  SEMINAR

  """A laboratory on its own."""
  LAB

  """Seminar-style teaching on its own."""
  SU

  """An exercise class on its own."""
  EXERCISE

  """A project."""
  PROJECT

  """
  Independent work — a thesis, a study project. Usually carries no hours per week at all.
  """
  SELF_STUDY

  """
  The catalogue declining to say, for a slot whose content varies. Also the value anything unrecognised becomes.
  """
  DEPENDS_ON_SUBJECT
}

"""
A newly created token: the record, and the one and only sight of the secret.
"""
type CreatedPersonalAccessToken {
  """The token as it will appear in your list from now on."""
  token: PersonalAccessToken!

  """
  The complete token, `tallox_<id>_<secret>` — put this in your script's environment.
  
  Shown once, here, and never again: the server keeps only a checksum. If you lose it, revoke
  this token and create another one. That is a two-second inconvenience, and it is the reason
  a leak of the database is not a leak of anybody's credentials.
  """
  secret: String!
}

"""
A calendar day, in the form `2026-10-01`.

Not an instant. Regulations that apply from the first of October do not apply from midnight,
and a deadline sent as a timestamp would let a reader's timezone decide which day was meant.
"""
scalar Date

"""A demand about to be declared."""
input DeclareCourseInstanceInput {
  """
  Four digits, a hyphen and SS or WS, for example `2027-SS`. Upper-cased and trimmed for you.
  """
  semester: String!

  """The study programme whose demand this is, by its short code."""
  programme: String!

  """
  The module, by id.
  
  The instance's parts are made from the module's split, or — while nobody has stated one — from
  `Module.proposedComponents`. Only a module the catalogue states no hours for has neither, and
  that answers `MODULE_NOT_DECOMPOSED`; the repair is `setModuleComponents`.
  """
  moduleId: ID!

  """
  The parallel cohort, or empty for a module that runs once. One to three characters, upper-cased
  and trimmed for you.
  
  Leave it empty at first: turning one cohort into two is `duplicateCourseInstance`, which names
  both letters at once.
  """
  track: String = ""

  """
  The cohort year, or `null` to take what the programme's regulations say — the earliest semester
  the module may be taken in, across every version of them.
  """
  programmeSemester: Int
}

"""One thing a plan did, or would do."""
type DemandChange {
  """The module this cohort offers."""
  moduleId: ID!

  """The module's name, so a summary can be read without a second query."""
  moduleName: String!

  """The cohort, after the change."""
  track: String!

  """
  Where a cohort was renamed rather than created: the letter it had before.
  
  IF1 becoming IF1A when a second cohort appears beside it. The instance is the same one, which is
  why its parts — and later the wishes on them — survive.
  """
  trackBefore: String

  """Where the number of groups changed: what it was."""
  groupsBefore: Int

  """Where the number of groups changed: what it is now."""
  groupsAfter: Int
}

"""
One study programme announcing that its demand for a semester is settled.
"""
type DemandCompletion {
  """The semester it is about."""
  semester: String!

  """The study programme whose demand is settled."""
  programme: Programme!

  """
  When it was last said.
  
  Moves when somebody re-announces after adding a late instance, because what a reader wants to
  know is how fresh the statement is. Unlike a publication mark, which keeps its first timestamp
  because it records something that cannot be walked back.
  """
  completedAt: Time!
}

"""One row of a demand table: this module, in these cohorts."""
input DemandEntryInput {
  """The module this row is about."""
  moduleId: ID!

  """
  The cohorts to offer. **An empty list is the row whose tick was taken away** and means the
  module is not offered — its instances are withdrawn.
  
  That is the whole difference between "leave it alone" and "withdraw it": a module the call does
  not mention at all is untouched.
  """
  tracks: [DemandTrackInput!]! = []

  """
  The cohort year for every cohort of this module, or `null` to leave what is stored — and, for a
  new instance, to take what the regulations say.
  """
  programmeSemester: Int
}

"""What a save did, or — after a dry run — what it would do."""
type DemandPlanReport {
  """True when nothing was written."""
  dryRun: Boolean!

  """Cohorts that were declared."""
  created: [DemandChange!]!

  """Cohorts that were withdrawn — the rows whose tick was taken away."""
  withdrawn: [DemandChange!]!

  """Cohorts that were renamed, or whose number of groups changed."""
  changed: [DemandChange!]!

  """
  What could not be done, one entry per cohort, with the rest of the plan applied.
  """
  refused: [DemandRefusal!]!

  """
  The demand of that programme afterwards — the whole list, so that one answer redraws the
  screen. After a dry run it is what is there now, because that is what is there.
  """
  instances: [CourseInstance!]!

  """
  The teaching those instances cost the faculty, summed. A shared lecture counts once.
  """
  teachingHours: Float!
}

"""One thing a plan could not do."""
type DemandRefusal {
  """The module the refused cohort offers."""
  moduleId: ID!

  """The module's name, so a summary can be read without a second query."""
  moduleName: String!

  """The cohort the refusal is about."""
  track: String!

  """
  The machine-readable half: `INSTANCE_IN_USE`, `TRACK_TAKEN`, `MODULE_NOT_DECOMPOSED`.
  
  A refusal costs exactly the cohort it is about; the rest of the plan is applied. That is why
  they are reported rather than raised: one module that cannot be withdrawn must not undo fifteen
  that could be declared.
  """
  code: String!

  """
  The sentence to show. `INSTANCE_IN_USE` deliberately says only that something hangs off the
  instance — never what, never how many.
  """
  message: String!
}

"""
One cohort of a module, on the way in: a letter and a number of parallel groups.
"""
input DemandTrackInput {
  """
  The cohort letter — the A in IF3A — or empty for a module that runs once.
  
  Upper-cased and trimmed for you. One to three characters.
  """
  track: String! = ""

  """
  How many parallel groups of the practical unit this cohort runs — laboratories, exercises, or
  the seminar of a module that is nothing else.
  
  A module that is nothing but a lecture has no such unit, and there this figure has no effect
  rather than being an error: a screen that sends the same number for every row must not fail on
  the one it cannot apply to.
  """
  groups: Int! = 1
}

"""
Whether a module is compulsory or elective in a study programme.

Three-valued rather than a boolean, because asked about a programme without naming a version of
its regulations the honest answer is sometimes neither. Measured over the whole catalogue, four
modules are compulsory under one version and elective under another — picking one silently would
be wrong for those four and unexplainable to whoever is looking at them.
"""
enum DutyStatus {
  """Compulsory under every version of the regulations asked about."""
  COMPULSORY

  """Elective under every version asked about."""
  ELECTIVE

  """Compulsory under some versions and elective under others."""
  MIXED
}

"""
How often a module is offered.

Useful as a filter: a module taught only in the summer is not a candidate for a winter
semester's demand, and 89 of them are. Three of the values say nothing about the term and
together are more than half the catalogue, so a term filter that hid them would remove most of
what somebody is looking for — see the note on `ModuleFilter.frequency`.
"""
enum Frequency {
  """Offered in both terms."""
  EVERY_SEMESTER

  """Offered in winter terms only."""
  EVERY_WINTER_SEMESTER

  """Offered in summer terms only."""
  EVERY_SUMMER_SEMESTER

  """
  Takes turns with other subjects of the same subject group. Which term it lands in is a
  decision inside the group rather than a rule, so it is not a term restriction.
  """
  ALTERNATING_WITHIN_SUBJECT_GROUP

  """Offered when it is announced. The largest group in the catalogue."""
  ON_ANNOUNCEMENT

  """
  The catalogue says nothing, or says something this version of the software does not
  recognise. The two are distinguished on the import page rather than here.
  """
  UNKNOWN
}

"""
One study programme's demand met by another study programme's event.

The case the faculty describes as "echter Bedarf in DE, und in GS eine Art Import": both
programmes need the module and it is held **once**. Both declarations stand — the difference
between them is what the import/export figures are about — but only one of them holds the
teaching, and only that one has parts.

Both sides agree to it. The lead of the programme whose demand is covered asks; the lead of the
programme that holds the event accepts. Each half is an ordinary demand write against that lead's
own programme, so neither needs anything in the other's — which is what makes it usable between
two leads who cannot reach each other's demand at all.
"""
type InstanceCoverage {
  """
  The instance on the other side: the one that holds the event, read from the cohort whose demand
  it meets — or that cohort, read from the holder.
  
  One level deep: the instance here carries no coverage of its own, and cannot, because an
  instance that is covered may not also cover somebody.
  """
  instance: CourseInstance!

  """When the covered programme's lead asked."""
  requestedAt: Time!

  """
  When the holding programme's lead agreed, or `null` while nobody has.
  
  Until it is set nothing is borrowed and nothing was removed: asking changes nothing, which is
  the whole of the two-sided handshake.
  """
  acceptedAt: Time
}

"""
One assignable unit of an instance: a lecture, a laboratory group, a seminar.

What a wish and an assignment will point at.
"""
type InstancePart {
  id: ID!

  """
  What kind of teaching this part is: a lecture, a laboratory group, a seminar.
  """
  kind: InstancePartKind!

  """Order within the instance."""
  position: Int!

  """
  What a **lecturer** is credited with for holding this part.
  
  Starts as what the module's split says and is editable afterwards: the two are different
  quantities that merely begin equal. `null` while nobody has stated it, which is a normal state
  for an instance declared before the detail was settled.
  """
  teachingHours: Float

  """
  This part is held once and serves the other cohorts of the same module as well.
  
  The shared lecture: one person gives it for IF3A and IF3B, it happens once, and its hours count
  once — here, at the cohort that owns the row. Not the default and never automatic: a cohort
  holds its own teaching unless somebody says otherwise, because sharing by default would make
  the faculty's hours look smaller than they are until somebody noticed.
  """
  sharedAcrossTracks: Boolean!
}

"""
One assignable unit of teaching.

The same vocabulary describes a module's canonical split and the parts an actual offering runs,
because the second is made from the first. Two lists that had to agree without a compiler saying
so would drift.
"""
enum InstancePartKind {
  """
  A lecture. The part that can be held once for several parallel cohorts.
  """
  LECTURE

  """A laboratory group. Usually the part that exists several times over."""
  LAB

  """An exercise group."""
  EXERCISE

  """A seminar group."""
  SEMINAR

  """A project group."""
  PROJECT

  """Anything the five above do not name."""
  OTHER
}

"""A course the faculty enters itself, on the way in."""
input LocalModuleInput {
  """
  The programme it is at home in, by its short code — and therefore who may enter it.
  
  Only on the way in. `changeLocalModule` does not accept it: the home programme is what the
  permission is judged against, so allowing it to move would let somebody push a row out of
  their own reach in the same request.
  """
  programme: String!

  """
  What it is called. Unique within the programme, case-insensitively — that is its identity.
  """
  name: String!

  """An ordinary course, or a placeholder for an elective."""
  kind: ModuleKind! = MODULE

  """
  How the teaching breaks up, in the examination office's own vocabulary.
  
  It decides what `proposedComponents` suggests, so it is worth getting right even when a split
  is stated here as well.
  """
  courseType: CourseType!

  """
  How often it runs. `ON_ANNOUNCEMENT` is the honest answer for most placeholders.
  """
  frequency: Frequency! = ON_ANNOUNCEMENT

  """
  Contact hours a student attends per week. Not teaching load — see `Module.components`.
  """
  contactHoursPerWeek: Int

  """ECTS credits, or `null` where nobody has said."""
  credits: Int

  """
  False takes it out of every list without deleting anything.
  
  There is no delete and there will not be one: instances point at a module, and later wishes
  will point at their parts. This is how a course nobody needs any more is retired.
  """
  active: Boolean! = true

  """
  The split, or omitted to let `proposedComponents` stand in.
  
  Worth stating for a placeholder: a module the catalogue gives no hours for is refused with
  `MODULE_NOT_DECOMPOSED` when somebody tries to declare an instance of it.
  """
  components: [ModuleComponentInput!]
}

"""
An entry in the module catalogue.

Modules are **not** what gets planned — instances are. A module is the catalogue entry an
instance is an offering of, and it survives a change of regulations: measured against the
source, a module keeps its identity across up to 19 sets of regulations and 9 programmes.
"""
type Module {
  id: ID!

  """
  Where this catalogue row comes from: the examination office's import, or the faculty itself.
  
  Not derivable from `zpaId` and deliberately its own field. Two fields that are only ever true
  together are two chances to write one of them, and this one is a statement the schema
  enforces (`module_local_has_no_zpa_ref`) rather than a coincidence of the data.
  
  What it is worth knowing for: `active`, `official` and "retired" are statements the
  examination office makes, and about a `LOCAL` row it makes none.
  """
  source: ModuleSource!

  """
  What this row stands for: an ordinary module, or a placeholder for an elective nobody has
  chosen yet.
  
  A placeholder is a module in every mechanical respect — it has hours, a split, instances, and
  later wishes — so that the whole planning works on it unchanged. **"We need three of them" is
  three cohorts of one placeholder**, which is what the identity of an instance already says:
  three offerings of one module in one programme and semester have to differ in their cohort.
  The constraint ("ideally something technical") is the placeholder's name.
  """
  kind: ModuleKind!

  """
  The name, which is empty for a handful of modules.
  
  The examination office's module records carry no name field at all — the name exists only
  inside an association with a set of regulations, so a module that appears in none has none
  anywhere. Kept and rendered by its identifier rather than hidden, because the person
  responsible for it has to be able to find it.
  """
  name: String!

  """The programme that plans this module. Every module has exactly one."""
  homeProgramme: Programme!

  """
  The faculty's own grouping this module belongs to, or `null` while nobody has assigned one.
  
  Exactly one, or none. "Whose subject group fills this instance" is the sentence the assignment
  phase is made of, and it has to have one answer.
  
  `null` is the ordinary state until the faculty has worked through its catalogue — see the
  `withoutSubjectGroup` filter, which is that work list. A reference rather than the whole group:
  the full `SubjectGroup` carries its leads and its members, and filling those in for every row of
  a 506-module catalogue would be a statement per module.
  """
  subjectGroup: SubjectGroupRef

  """
  Who the examination office names as responsible for this module, or `null`.
  
  Null for about one module in thirty, and for two different reasons that are not
  distinguished here: the source names a placeholder rather than a person, or it names an
  address that is not in the teacher list. Both appear on the import page, where the raw value
  is; it is deliberately not carried here, because a mail address belongs in the type about
  people rather than in the one about modules.
  """
  responsible: Teacher

  """How the teaching is broken up, as the catalogue describes it."""
  courseType: CourseType!

  """How often it runs."""
  frequency: Frequency!

  """
  Contact hours a **student** attends per week, as the catalogue states them.
  
  **Not teaching load.** The teaching held for one instance is the sum over its parts and is
  routinely larger: a four-hour module running one lecture and three laboratory groups costs the
  faculty eight hours. Summing this field is the plausible-looking wrong answer.
  """
  contactHoursPerWeek: Int

  """ECTS credits, as the catalogue states them."""
  credits: Int

  """
  False for a module the examination office has retired but still publishes.
  
  Distinct from a module it has stopped publishing altogether, which is `retiredAt`.
  """
  active: Boolean!

  """False for a module the examination office has not made official."""
  official: Boolean!

  """
  When a successful import stopped mentioning this module, or `null`. Modules are never deleted.
  """
  retiredAt: Time

  """
  The examination office's identifier, for cross-referencing.
  
  Information, never an argument. Making an imported identifier the thing external scripts key
  on is the mistake the whole import layer is arranged to avoid — undoing it later would mean
  changing somebody else's script rather than this schema.
  """
  zpaId: String

  """
  How the module's hours divide between teachable units — two of lecture and two of laboratory,
  say.
  
  **Empty means nobody has stated it yet**, and that is a normal state rather than an error: the
  examination office publishes one total and no split, so this is the faculty's own knowledge.
  While it is empty, `proposedComponents` stands in — an instance declared for such a module is
  made from the proposal and marked as resting on a guess. Only a module the catalogue states no
  hours for has neither, and that one cannot be declared at all.
  """
  components: [ModuleComponent!]!

  """
  The sum of the components, or `null` while there are none. Compare with `contactHoursPerWeek`.
  """
  componentHours: Float

  """
  Where this module counts: one entry per version of a programme's regulations.
  
  The union over every programme and version, unfiltered. A module dropped from the newest
  version of one programme's regulations is still being taught to the students of the older one.
  """
  offerings: [ModuleOffering!]!

  """
  Compulsory or elective in one programme, folded over every version of its regulations, or
  `null` if the module does not appear in that programme's catalogue at all.
  
  `MIXED` is the honest answer where the versions disagree, which happens.
  """
  dutyStatus(
    """The programme's short code."""
    programme: String!
  ): DutyStatus

  """
  Whether this module appears in the named programme's catalogue.
  
  `false` together with a `homeProgramme` of that programme is a real and common state — the
  module is the programme's own and does not currently count in any version of its regulations.
  Twenty-six active modules are in it, which is why a programme's module list is the union of its
  catalogue and its own modules rather than the catalogue alone.
  """
  inCatalogue(
    """The programme's short code."""
    programme: String!
  ): Boolean!

  """
  How this module's hours would divide if nobody stated it — the software's own guess.
  
  Derived from the course type and the total on every read, and **never stored**: the laboratory
  or exercise is two hours, the unit a group is actually taught in, and the lecture takes the
  rest. That gives the lecture an even number of hours, which is what the faculty's own planning
  is made of — a six-hour module is four plus two, never three plus three.
  
  Empty for a module the catalogue gives no hours for. Confirming a proposal is
  `setModuleComponents` with exactly these values.
  """
  proposedComponents: [ComponentProposal!]!

  """
  Whether what this module is currently planned with is a guess.
  
  True while `components` is empty and a proposal exists. It is the mark an interface puts on the
  row, and the reason it is not simply "components is empty": a module the catalogue states no
  hours for has neither, and a warning on that row would point at nothing to confirm.
  """
  splitIsEstimated: Boolean!

  """
  Which kind of part a number of parallel groups multiplies.
  
  The first unit of the split that is not the lecture: the laboratory of a lecture-plus-laboratory
  module, the exercise of a lecture-plus-exercise one, and the seminar of a module that is nothing
  else — those do run in parallel groups. `null` for a module that is only a lecture, where a
  number of groups has nothing to multiply.
  
  Here so that an interface offering a "how many groups" control asks the same question
  `planDemand` answers with, rather than deriving it a second time from the split.
  """
  practicalKind: InstancePartKind

  """
  Whether an instance can be declared for this module.
  
  True as soon as there is something to make parts from — a stated split **or** a proposal. Only
  the modules with no hours at all are left out, twelve in the real catalogue, and for those the
  repair is to state the split by hand.
  
  Answered here rather than worked out by each caller, because the same question is asked by the
  picker that offers a module, by the refusal that turns one away, and by the transaction that
  writes the parts.
  """
  plannable: Boolean!

  """
  The earliest programme semester a student may take this module in, in one programme — or `null`
  where its regulations do not say, which is nearly half the elective catalogue.
  
  Folded over every version of that programme's regulations, taking the earliest. 23 of 1076
  module/programme pairs disagree across versions, and the earliest is the one that puts the
  module where somebody looking for it expects it — the same choice a new instance's cohort year
  is seeded with.
  """
  programmeSemester(
    """The programme's short code."""
    programme: String!
  ): Int
}

"""
How one module's hours divide between teachable units.

Stated once per module by the people who know it, and stable — a new version of the regulations
does not change it. The examination office publishes one figure per module and a phrase
describing the breakdown; whether four hours are two of lecture and two of laboratory, or three
and one, exists nowhere in the source.
"""
type ModuleComponent {
  id: ID!

  """What kind of teaching this unit is."""
  kind: InstancePartKind!

  """
  Hours per week for **one** unit of this kind.
  
  A module with two hours of laboratory has one entry saying two, however many parallel groups
  an instance later runs — the multiplicity belongs to the instance.
  """
  teachingHours: Float!

  """Order within the module."""
  position: Int!
}

"""One unit of a module's split, on the way in."""
input ModuleComponentInput {
  """What kind of teaching this unit is."""
  kind: InstancePartKind!

  """Hours per week for one unit of this kind. Greater than zero."""
  teachingHours: Float!
}

"""
Which modules to list.

An input type rather than separate arguments, unlike `people(search:, includeInactive:)`
elsewhere in this schema: six filters is past the point where positional arguments read, the set
will grow as subject groups and competences arrive, and an interface's form maps onto it field
for field.
"""
input ModuleFilter {
  """
  Relevant for this study programme, by its short code.
  
  Two things at once, and the second half is not redundant: the module counts in one of the
  programme's sets of regulations, **or** the programme is its home. Twenty-six active modules
  are only reachable through the second half, ten of them in the faculty's largest programme —
  and the first thing somebody does is look for a module they are responsible for.
  """
  programme: String

  """
  Narrow to one version of the regulations.
  
  No default, deliberately. Unfiltered, a programme's list is the union over every version it
  has: a module dropped from the newest one is still being taught to the students of the older.
  """
  spo: ID

  """
  Keep only modules with one of these frequencies.
  
  To find what could run in a winter semester, ask for `EVERY_WINTER_SEMESTER`,
  `EVERY_SEMESTER`, `ALTERNATING_WITHIN_SUBJECT_GROUP`, `ON_ANNOUNCEMENT` and `UNKNOWN` — the
  last three say nothing about the term and are together more than half the catalogue, so
  leaving them out hides far more than it removes.
  """
  frequency: [Frequency!]

  """
  Compulsory or elective. Requires `programme`, and is ignored without it — the answer is a
  property of a module *in a programme*, not of a module.
  """
  duty: DutyStatus

  """
  A substring of the name or of one of the module codes. Case-insensitive.
  """
  search: String

  """
  Include modules the examination office has retired. About a hundred of them.
  """
  includeInactive: Boolean = false

  """Only the modules this person is responsible for, by teacher id."""
  responsible: ID

  """
  Keep only modules whose split nobody has confirmed yet — where `splitIsEstimated` is true.
  
  The work list. Planning works without it, because the proposal stands in; what this filter
  finds is where the software is guessing and a person has not yet agreed. A bounded, finishable
  task rather than an open form.
  """
  withoutComponents: Boolean = false

  """
  Keep only modules that are in no subject group yet.
  
  The other half of the same work list, and the one October starts with: an instance can be
  declared without a subject group, but nobody can be shown their own subjects on the wish screen
  until the modules are in one.
  """
  withoutSubjectGroup: Boolean = false

  """Keep only the modules of one subject group, by id."""
  subjectGroup: ID
}

"""What a catalogue row stands for."""
enum ModuleKind {
  """An ordinary module."""
  MODULE

  """
  A placeholder for an elective nobody has chosen yet: "we need three, ideally something
  technical".
  
  Planned like any other module, so that the demand, the hours and later the wishes work on it
  unchanged. Colleagues register interest in one of its cohorts with a concrete subject in mind.
  """
  FWP_PLACEHOLDER
}

"""
This module counts in this version of these regulations.

One entry per module per version, folded from the catalogue slots the module sits in. Rebuilt
from the examination office's data on every import and never edited here: it is a statement
about somebody else's regulations, and an editable copy would be a second version of them that
nobody in the faculty is authorised to keep.
"""
type ModuleOffering {
  """The version of the regulations this module counts in."""
  spo: Spo!

  """Compulsory or elective, as the catalogue slot says."""
  isDuty: Boolean!

  """
  The codes this module carries in these regulations, possibly several.
  
  Display only, never an identifier. The code belongs to the module-regulations-slot triple
  rather than to the module: 85 module/version pairs carry more than one because the
  specialisation is inside the code, one module carries eight across the catalogue, and a fifth
  of the source rows carry none at all.
  """
  moduleCodes: [String!]!

  """The specialisations whose catalogue this module sits in."""
  focuses: [String!]!

  """
  The earliest programme semester a student may take it in.
  
  A floor, not a cohort year and not a timetable slot. Nearly half the source rows say 1, which
  for an elective means "no restriction".
  """
  minProgrammeSemester: Int
}

"""
A module as a subject group refers to it: enough to recognise, and no more.

The counterpart of `SubjectGroupRef`, and it exists for the same reason: a full `Module` carries
its split, its offerings and its regulations, and a screen asking "what is in this group" wants a
list of names.
"""
type ModuleRef {
  id: ID!

  """
  The name, which is empty for a handful of modules the examination office publishes no name for.
  """
  name: String!

  """
  The programme that plans it — IF, IG.
  
  Carried because a subject group reaches across programmes, so the code is what tells two
  similarly named modules apart.
  """
  homeProgrammeCode: String!
}

"""Where a catalogue row comes from."""
enum ModuleSource {
  """Written by the import from the examination office's catalogue."""
  ZPA

  """
  Entered by the faculty: a course that is not in the examination office's catalogue — or not
  yet — and the FWP placeholders.
  
  The import never touches such a row, and it never carries a `zpaId`.
  """
  LOCAL
}

"""
Everything that changes something.

All of it is `@interactiveOnly` for now: writing happens in a signed-in browser session, not
through a Personal Access Token.
"""
type Mutation {
  """
  Create a Personal Access Token for yourself.
  
  The secret comes back once, in the response. Only in a signed-in browser session: through a
  token this fails with `INTERACTIVE_ONLY`, so that a leaked token cannot create its own
  successors.
  """
  createPersonalAccessToken(
    """
    What it is for, in your own words. Not secret — it is there so you recognise it later.
    """
    description: String!

    """
    How many days it should live. 90 if you leave this out, 365 at most, 1 at least.
    """
    expiresInDays: Int

    """
    What this token may reach. **Leave it out and the token is unrestricted** — it can do
    everything your roles allow.
    
    A scope only ever narrows. Listing `PLANNING: READ` gives you a token that reads the
    planning and nothing else, however much your roles would otherwise permit; it cannot give
    you anything you do not already hold.
    
    Which fields belong to which area is listed on `ScopeArea`. `WRITE` includes `READ` in the
    same area, so a token that reads and writes the planning needs one entry, not two.
    
    Fixed at creation. There is no way to change the scopes of an existing token — mint a new
    one and revoke this one, so that what the holder believes it can do and what it can do are
    never two different things.
    """
    scopes: [ScopeGrantInput!]
  ): CreatedPersonalAccessToken!

  """
  Withdraw one of your own tokens. Immediate, and there is no way back.
  
  Revoking a token that is already revoked changes nothing and is not an error. A token that
  does not exist and a token belonging to somebody else produce the same refusal.
  """
  revokePersonalAccessToken(id: ID!): PersonalAccessToken!

  """
  Add somebody to this installation.
  
  The mail address is all that is required, and it is the only thing that has to be right: it
  is what the login asserts, so it decides whether this person can sign in at all. The name
  can be filled in later, by them or by an import. Requiring it here would mean finding out
  how a new colleague spells their first name before their account can exist.
  
  A new person holds no roles. Even LECTURER is granted explicitly, so that who may do what is
  a list somebody wrote rather than a default nobody chose.
  """
  createPerson(mail: String!, name: String): Person!

  """Set somebody's display name."""
  renamePerson(id: ID!, name: String!): Person!

  """
  Bring somebody's roles to exactly this set.
  
  The whole set rather than add and remove, because that is what the screen shows and because
  add/remove loses to a race the moment two administrators have the same person open: the
  second one's stale view of what the first did would decide the outcome.
  
  `expiresAt` applies to the roles being *added*. Roles already held keep their own expiry
  unless they are re-granted, so re-sending an unchanged set does not silently extend
  anything.
  
  Refused with `LAST_ADMIN` when it would leave the installation with nobody who can
  administer it.
  """
  setPersonRoles(id: ID!, roles: [Role!]!, expiresAt: Time): Person!

  """
  Activate or deactivate somebody.
  
  Deactivating is the removal this system has: an inactive person fails authentication on both
  doors, so it withdraws their tokens in the same moment without touching a token row.
  
  Refused with `LAST_ADMIN` when it would deactivate the last administrator — that is the same
  refusal as taking their ADMIN away, because it has the same consequence.
  """
  setPersonActive(id: ID!, active: Boolean!): Person!

  """
  Set which study programmes somebody's leadership applies to.
  
  The whole set at once, like `setPersonRoles` and for the same reason: a per-programme mutation
  would let the two halves of a swap be separated, and in between somebody leads a programme
  nobody meant them to.
  
  The person has to hold `PROGRAMME_LEAD` already, or this is refused with
  `NOT_A_PROGRAMME_LEAD` — grant the role first. An unknown code is refused with
  `UNKNOWN_PROGRAMME` rather than silently dropped.
  
  An empty list is allowed and means they lead none. That is the state a fresh grant is in, and
  it is **not** "all of them": such a lead may declare no demand until somebody assigns them a
  programme. The refusal they meet says exactly that, so nobody goes asking for a role they
  already hold.
  """
  setPersonProgrammes(
    id: ID!

    """
    Short codes, for example `["IF", "IG"]`. Upper-cased and de-duplicated for you.
    """
    programmes: [String!]!
  ): Person!

  """
  Let somebody from the examination office's list into this installation, or withdraw them.
  
  Admitting creates the account if there is none and reactivates it if there is one, and grants
  `LECTURER`. That is the one place here where a new account is not roleless, and it is what the
  act says: standing in the list of the people who teach is what that role means. It is also the
  smallest role there is — the module catalogue, and one's own profile and entries.
  
  Withdrawing deactivates. Nobody is ever deleted: the grants stay, so admitting somebody again
  restores what they had rather than starting them over, and their assignments stay in the
  history. It is refused with `LAST_ADMIN` when it would leave the installation with nobody who
  can administer it.
  
  Both directions can be repeated. Sending the state somebody is already in changes nothing,
  which is what a switch on a screen means and what a second click deserves.
  
  Refused with `TEACHER_HAS_NO_MAIL` for the handful the examination office gives no address
  for. The address is the whole link between the two lists, so there is nothing to admit them
  by — and nothing to invent here either.
  """
  setTeacherAdmitted(
    teacherId: ID!

    """True admits, false withdraws."""
    admitted: Boolean!
  ): TeacherAccount!

  """
  Put somebody on a part of an instance.
  
  Pass exactly one of `personId` and `teacherId`. A teacher who holds an account is stored as the
  account.
  
  **`replacing` is what makes this safe when two people decide at once.** It is the id of the
  assignment you were looking at; omit it to say "I believe this part is free". A call that names
  nothing can only ever fill a part nobody holds, so somebody who has not seen the current state
  cannot take a decision away from somebody who has. Since the lead of the module's subject group
  and the lead of the instance's study programme may both write this row, that is not a formality.
  
  Refusals: `ASSIGNMENT_PHASE_CLOSED` before the assignment phase, `NOT_YOUR_SUBJECT` when you are
  responsible for neither the subject nor the programme, `PART_ALREADY_ASSIGNED` when you believed
  a part was free and it is not, `ASSIGNMENT_MOVED_ON` when the assignment you named is no longer
  the one there, `ASSIGNEE_INVALID` for neither or both ids, `ASSIGNEE_NOT_FOUND` for one that
  does not resolve.
  """
  setAssignment(
    """The part to fill."""
    instancePartId: ID!

    """The account to put on it. Mutually exclusive with `teacherId`."""
    personId: ID

    """
    The examination office's record to put on it. Mutually exclusive with `personId`.
    """
    teacherId: ID

    """What to record about the decision. At most 500 characters."""
    note: String

    """
    The assignment being replaced, or omitted when the part is believed to be free.
    """
    replacing: ID
  ): Assignment!

  """
  Give a part back: remove an assignment.
  
  Bound by the same phase and the same responsibility as making one. A list that may be added to
  but not corrected is worse than a closed one.
  
  Returns the id of what was removed. `ASSIGNMENT_NOT_FOUND` covers both "there is no such
  assignment" and "that one is not yours" — deliberately the same answer.
  """
  clearAssignment(id: ID!): ID!

  """
  Record that this faculty plans a study programme, or no longer does.
  
  The catalogue is the examination office's and cannot say this — the measurement is on
  `Programme.planningStatus` — so it is a decision, and this is where it is taken. Both
  directions: a programme that has run out is marked `DISCONTINUED`, and one that starts is
  marked `PLANNED`.
  
  The dean's office, like the phases and the planning semester, and through both doors for the
  same reason: it is reversible and it is ordinary process work. `ADMIN` is deliberately not on
  the list — running the installation is a different job from planning with it.
  
  A programme this faculty does not plan is offered in no picker and may be granted to no
  programme lead; the demand of one that has run out stays readable, because that is the record
  of what the faculty did.
  """
  setProgrammePlanningStatus(
    """The programme's short code. Upper-cased and trimmed for you."""
    code: String!
    status: ProgrammeStatus!
  ): Programme!

  """
  Enter a course this faculty offers and the examination office's catalogue does not list.
  
  Two cases, and both are ordinary planning: a course that is not in the ZPA (yet), and an FWP
  placeholder — "we need three electives, ideally something technical" — declared before the
  subjects are known. Both become `module` rows, so the split, the instance, the hours and
  later the wishes all work on them unchanged.
  
  Allowed for the lead of the programme it is at home in, and for the dean's office — the same
  rule `setModuleComponents` uses, and the same sentence behind it: a module is planned where
  it is at home. **No phase condition**, deliberately: a module hangs off no semester, so there
  is no phase that could close it. The phase gate applies at the instance, where it belongs.
  
  A second course of the same name in the same programme is `MODULE_NAME_TAKEN` — there is no
  other identity for a row somebody typed, so two clicks on the button are one row.
  """
  createLocalModule(input: LocalModuleInput!): Module!

  """
  Correct one, or take it out of the lists with `active: false`.
  
  Only a row this faculty entered. An imported module answers `MODULE_NOT_FOUND`, exactly as an
  id that names nothing does: it is not this mutation's to edit, and saying which of the two it
  is would only invite a second attempt.
  
  Replaces the whole description, `components` included — same reason `setModuleComponents`
  does: the entries only mean anything together.
  """
  changeLocalModule(id: ID!, input: LocalModuleInput!): Module!

  """
  State how a module's hours divide between teachable units.
  
  Replaces the whole split rather than editing one entry: the entries only mean anything
  together, and a per-entry mutation would allow a moment where a module's hours add up to
  something nobody intended.
  
  Allowed for the study programme lead of the module's **home** programme and for the dean's
  office. Not for a lead in whose catalogue the module merely counts — the module is planned
  where it is at home, and two programmes editing one split would disagree in the database.
  
  Passing an empty list clears the split, and the module falls back to `proposedComponents` —
  marked as a guess again. That is allowed on purpose: a split entered wrongly should be
  removable by the person who entered it, and doing so must not make the module unplannable.
  """
  setModuleComponents(
    moduleId: ID!

    """In order. At least one entry, or none at all to clear the split."""
    components: [ModuleComponentInput!]!
  ): Module!

  """
  Plan a whole screen of demand at once: which modules are offered, in how many cohorts, with how
  many groups in each.
  
  # What it may touch
  
  **Only the modules named in `entries`.** A module the call does not mention is not planned, not
  unplanned, not touched. That is what makes it safe to plan from a filtered list: a screen
  showing the compulsory modules of the third semester must never withdraw the electives it is not
  showing.
  
  # What it does
  
  Per module, per cohort: a cohort that is wanted and missing is declared, one that is wanted and
  there has its number of groups adjusted, and one that is no longer wanted is withdrawn. Where a
  cohort is added beside an unlettered one, the existing instance is *renamed* rather than
  replaced — IF1 becomes IF1A — so that its parts survive.
  
  All of it in one transaction. A single cohort that cannot be withdrawn because something already
  hangs off it is reported in `refused` and costs exactly that cohort.
  
  # dryRun
  
  Runs the same reconciliation and rolls it back, so the report is what a save would do rather
  than a second computation that might disagree. It also records nothing about the semester: the
  row that says a decision was taken comes into being with the decision, not with the preview.
  
  It is the reason every mutation in this file is `@interactiveOnly`. A dry run is free, leaves no
  trace and reports `INSTANCE_IN_USE` per cohort — which through a Personal Access Token would be
  "which of this programme's instances are wished for", in one call, with no login event. See the
  note at the top of this file.
  """
  planDemand(
    """Four digits, a hyphen and SS or WS, for example `2027-SS`."""
    semester: String!

    """The study programme whose demand this is, by its short code."""
    programme: String!

    """
    One entry per module the caller is planning. Modules not named here are untouched.
    """
    entries: [DemandEntryInput!]!

    """Report what would happen and write nothing."""
    dryRun: Boolean! = false
  ): DemandPlanReport!

  """
  Declare that a study programme needs this module in this semester, for this cohort.
  
  Allowed for the lead of **that** programme and for the dean's office — and in every phase,
  including `FINAL`. An instance declared during the assignment is a correction, and corrections
  happen; a tool that refuses one moves it into a spreadsheet passed around by mail.
  
  The parts are made from the module's split, one per unit, each credited with the hours the
  split states — or from the proposal, where nobody has stated a split. A module the catalogue
  gives no hours for is refused with `MODULE_NOT_DECOMPOSED`.
  
  Declaring the same cohort twice is `TRACK_TAKEN`.
  """
  declareCourseInstance(input: DeclareCourseInstanceInput!): CourseInstance!

  """
  Copy an instance to a second parallel cohort — IF1 becomes IF1A and IF1B.
  
  `sourceTrack` renames the original in the same act, and that is why this is one mutation rather
  than two: a single cohort becoming two is one decision, and doing it in two steps leaves a
  moment in which the pair does not look like a pair and every label is wrong.
  
  A part that is already held for the sibling cohorts is **not** copied — it already serves the
  new one, and copying it would be the same lecture twice with its hours counted twice.
  """
  duplicateCourseInstance(
    id: ID!

    """
    The new cohort's letter. Required: without one the copy would collide with its own source.
    """
    track: String!

    """
    What the source cohort should be called from now on. Omit to leave it as it is.
    """
    sourceTrack: String
  ): CourseInstance!

  """
  Change the two editable things about an instance: its cohort and its cohort year.
  
  The module, the programme and the semester are not among them. Changing one of those is not an
  edit of this instance — it is a different instance, and the parts, and later the wishes, belong
  to the one that was declared.
  """
  changeCourseInstance(id: ID!, track: String!, programmeSemester: Int): CourseInstance!

  """
  Withdraw an instance that is not needed after all. Its parts go with it.
  
  Refused with `INSTANCE_IN_USE` once anything hangs off it. That refusal deliberately says
  nothing about *what* — no count, no kind of thing named. The wish table is what points at an
  instance part, and "this instance has three wishes" is the confidential fact with the names
  taken out.
  
  Only in a signed-in browser session: through a Personal Access Token this fails with
  `INTERACTIVE_ONLY`. The refusal above is an answer about wishes, and through a token the wish
  rule reaches only your own — see the note at the top of this file.
  
  Returns the id of the withdrawn instance, so that a list can drop it without asking again.
  """
  withdrawCourseInstance(id: ID!): ID!

  """
  Add a part to an instance — the second laboratory group, the tutorial nobody planned for.
  
  This is how the multiplicity of a module's split is expressed. The split says a laboratory is
  two hours; how many groups of it a cohort runs is a planning decision and belongs here.
  """
  addInstancePart(
    instanceId: ID!
    kind: InstancePartKind!

    """What a lecturer is credited with. Omit while it is not settled."""
    teachingHours: Float
  ): CourseInstance!

  """Correct a part's kind or hours."""
  changeInstancePart(id: ID!, kind: InstancePartKind!, teachingHours: Float): CourseInstance!

  """
  Remove a part. Refused with `INSTANCE_IN_USE` once anything hangs off it.
  """
  removeInstancePart(id: ID!): CourseInstance!

  """
  Hold this part once for all the parallel cohorts of its module.
  
  The shared lecture: one person gives it for IF3A and IF3B, it happens once, and its hours count
  once. The sibling cohorts' own parts of the same kind are removed in the same act — a database
  in which only the flag was written has a cohort attending two lectures.
  
  Refused with `NO_SIBLING_TRACKS` where there is no second cohort to share with, and with
  `INSTANCE_IN_USE` if one of the parts that would go is already spoken for.
  """
  shareInstancePartAcrossTracks(id: ID!): CourseInstance!

  """
  Undo that: every cohort holds its own again, with the same hours.
  
  As easy as the merge on purpose, because sharing is a judgement that gets revised — the person
  who was going to give both lectures is on sabbatical. A cohort that already has a part of that
  kind is left alone rather than given a second one.
  """
  splitInstancePartAcrossTracks(id: ID!): CourseInstance!

  """
  Ask that this instance's demand be met by another study programme's event.
  
  The case: two programmes need the same module and hold it **once**, together. Both declarations
  stay — the difference between them is what the import/export figures are about — but only the
  holding one has parts, so the event costs the faculty once.
  
  Nothing happens until the other programme's lead agrees. Asking is a statement about your own
  declaration and changes nothing about the instance you name, which is why you may name one whose
  demand you could not write yourself.
  
  The covering instance must be the same module in the same semester, in another programme, and
  not itself covered: `COVERAGE_MODULE_MISMATCH`, `COVERAGE_SAME_PROGRAMME` — for which the
  shared lecture across parallel cohorts is the right tool — and `COVERAGE_WOULD_CHAIN`. Asking
  while a link already stands is `COVERAGE_ALREADY_SET`; pointing a request somewhere else is
  ending it and asking again, which is two decisions.
  """
  requestInstanceCoverage(
    """Your instance, whose demand is met elsewhere."""
    id: ID!

    """The other programme's instance that holds the event."""
    coveredBy: ID!
  ): CourseInstance!

  """
  Agree to hold this event for the asking study programme as well.
  
  For the lead of the programme that **holds** the event, not the one that asked: agreeing is a
  statement about your own teaching. The asking cohort's own parts are removed in the same act — a
  database in which only the agreement was written counts one event twice.
  
  Refused with `PART_ASSIGNED` when one of the parts that would go is already filled, and then
  nothing at all has happened: the agreement is not written either. Refused with
  `COVERAGE_NOT_REQUESTED` where nobody asked, or where the asking lead has since pointed
  somewhere else, and with `COVERAGE_ALREADY_ACCEPTED` where this is already agreed.
  
  Wishes registered for the asking cohort are untouched. Somebody's interest in teaching the
  module for their own programme does not stop being true because the event is now held jointly,
  and where it is decided — filling the holding cohort's part — is where both programmes' wishes
  are read together.
  """
  acceptInstanceCoverage(
    """The asking instance — the one whose demand you are agreeing to meet."""
    id: ID!
  ): CourseInstance!

  """
  End it: a request withdrawn, a request declined, or an agreement revised.
  
  Either lead may — the asking programme because it is their demand, the holding one because it is
  their teaching. One mutation for all three because they are one state: the demand is simply not
  covered any more.
  
  Where it had been agreed, the asking cohort gets its teaching back, built from the module's
  split. What does not come back is the number of laboratory **groups**: the split states one unit
  per kind, and the multiplicity was a planning decision that went with the parts.
  
  `COVERAGE_NOT_REQUESTED` where there is nothing to end.
  """
  releaseInstanceCoverage(id: ID!): CourseInstance!

  """
  Declare in one semester what the same programme declared in another.
  
  What it carries over is the previous semester's *instances and their parts*, not the modules'
  splits — so the number of laboratory groups, which is a planning decision somebody made last
  year, comes with it. That is the difference between this and declaring each instance by hand,
  and the reason it exists.
  
  Instances already declared in the target are left untouched and counted as skipped. A shared
  lecture stays shared, because its sibling cohort is copied too.
  
  The permission is about the **target** semester: what is being written is next year's demand.
  """
  copyDemandFromSemester(
    """The semester to copy from."""
    from: String!

    """The semester to copy into."""
    to: String!

    """The study programme, by its short code."""
    programme: String!
  ): CopyDemandReport!

  """
  Announce this study programme's demand as settled for a semester, or withdraw the announcement.
  
  Blocks nothing either way. Declaring another instance afterwards stays possible and is the
  ordinary case; re-announcing then refreshes the timestamp.
  
  `complete: false` withdraws and answers `null` — there is no "withdrawn" state to return, because
  it is the same state as never having announced.
  
  Only the lead of that study programme and the dean's office. Not bound by the phase: announcing
  is a statement about work somebody did, not a change to the plan.
  """
  setDemandComplete(
    """Four digits, a hyphen and SS or WS."""
    semester: String!

    """The study programme's code."""
    programme: String!

    """True to announce or refresh, false to withdraw."""
    complete: Boolean!
  ): DemandCompletion

  """
  Open or shut one subject group's wish round for a semester.
  
  In either direction and at any time: a round that was shut can be opened again, which is what
  makes this a door rather than a phase.
  
  Only the lead of that subject group and the dean's office — the same reach as filling that
  subject's instances, which is the point: the person who shuts the round is the one who then works
  from what it collected.
  
  Reachable through both doors. Shutting a round is ordinary process work and reversible, the same
  reading `advanceSemesterPhase` takes.
  """
  setWishWindow(
    """Four digits, a hyphen and SS or WS."""
    semester: String!

    """The subject group whose round this is."""
    subjectGroupId: ID!

    """True to take entries, false to stop."""
    open: Boolean!
  ): WishWindow!

  """
  Move a semester one step through the process, forwards or backwards.
  
  Only to an adjacent phase — see `reachablePhases`. A semester nobody has touched is in
  `DEMAND_PLANNING`, so this works on any semester within reach without anything having to be
  set up first. If somebody else switched it between your reading it and this call, you get
  `PHASE_MOVED_ON` and nothing changes.
  
  The code is upper-cased and trimmed for you, so `2026-ws` is accepted. It is not otherwise
  repaired: `WS 2026` is refused rather than rearranged — that spelling is only unambiguous if
  one already knows the year names the term's *start*, and a wrong guess there would record a
  decision about a semester one year out that looks like one somebody chose.
  """
  advanceSemesterPhase(
    """Four digits, a hyphen and SS or WS, for example `2026-WS`."""
    code: String!
    to: Phase!
  ): Semester!

  """
  Say which semester the faculty is planning from now on.
  
  Moves the mark off whichever semester carried it, in the same act — at most one semester is
  being planned, and the two halves are one decision. Setting the semester that already carries
  it is not an error and changes nothing but the timestamp of the decision.
  
  The dean's office, like the phase, and through both doors for the same reason: rolling the
  faculty on to the next semester is ordinary process work and it is reversible. Any plannable
  code is accepted, including one no decision has been recorded about — saying that a semester
  is the one being planned *is* the first decision about it, and it is what puts the row there.
  
  Two people setting it at the same moment both succeed; the second one wins. That is the right
  outcome for a decision somebody is taking on purpose, and it is why there is no
  `PHASE_MOVED_ON` counterpart here.
  """
  setPlanningSemester(
    """Four digits, a hyphen and SS or WS, for example `2027-SS`."""
    code: String!
  ): Semester!

  """
  End the confidentiality window: make the wishes of this semester visible to everybody.
  
  **There is no way back.** Calling it twice is not an error and does not move the timestamp.
  
  Only in a signed-in browser session: through a Personal Access Token this fails with
  `INTERACTIVE_ONLY`.
  """
  publishWishes(code: String!): Semester!

  """
  End the confidentiality window over the assignments: make who holds what visible to everybody.
  
  **There is no way back.** Calling it twice is not an error and does not move the timestamp.
  
  `@interactiveOnly` for the same reason `publishWishes` is: it cannot be undone, and it is the
  moment a confidentiality rule stops applying. An act that cannot be walked back should be
  attributable to a sign-in rather than to a string in a script.
  """
  publishAssignments(code: String!): Semester!

  """
  Create a subject group.
  
  Administration, and only in a signed-in browser session — the same terms as every other act
  that shapes who may do what here.
  """
  createSubjectGroup(
    """
    Up to sixteen characters: upper case, digits, dot, underscore or hyphen. Upper-cased and trimmed for you.
    """
    code: String!

    """The name a person reads."""
    name: String!
  ): SubjectGroup!

  """
  Change a subject group's name.
  
  The code is not among the things this changes. It is the address — it appears in URLs and in
  colleagues' scripts — and moving it is not a rename but a different group.
  """
  renameSubjectGroup(id: ID!, name: String!): SubjectGroup!

  """
  Retire a subject group, or bring it back.
  
  There is no delete. Splitting a group is: create the new one, move the modules and the people,
  retire the old one — three steps, none of which loses anything.
  """
  setSubjectGroupActive(id: ID!, active: Boolean!): SubjectGroup!

  """
  Put a batch of modules into one subject group, or take them out of every group.
  
  A batch because the task this exists for is assigning 506 modules, and a screen that saves one
  row per click is a task nobody finishes.
  
  A module already in another group is **moved**, in one statement, so there is no moment in which
  it belongs to nothing. Pass `null` for `subjectGroup` to clear the assignment instead.
  """
  setModulesSubjectGroup(
    """The modules to assign. Modules not named here are untouched."""
    moduleIds: [ID!]!

    """The group to put them in, or `null` to take them out of every group."""
    subjectGroup: ID
  ): SubjectGroupAssignmentReport!

  """
  Replace the **members** of one subject group.
  
  The whole set at once, like `setPersonRoles` and `setPersonProgrammes` and for the same reason: a
  per-person mutation would let the two calls of a swap be separated, and the interval between them
  is one in which somebody is in a group nobody meant them to be in.
  
  Membership grants nothing — it decides what the wish screen offers first. It is administered
  anyway, because who works in which subject group is what the faculty's organisation looks like,
  not a preference somebody sets for themselves.
  """
  setSubjectGroupMembers(id: ID!, personIds: [ID!]!): SubjectGroup!

  """
  Replace the subject groups **you** are in.
  
  Yours only, and deliberately not administration. Membership grants nothing — it decides what the
  wish screen offers first and nothing else — so what somebody changes here is a statement about
  which subjects they work in, and that is theirs to make. Requiring an administrator for it would
  turn a preselection into something a colleague has to ask for, which is how a preselection
  becomes a barrier.
  
  What this does **not** touch is who *leads* a group. That one is a grant, it decides who reads
  unpublished wishes before publication, and it stays with `setSubjectGroupLeads`.
  
  The whole set at once, like every other membership write: a per-group mutation would let the two
  halves of a swap be separated.
  """
  setMySubjectGroups(subjectGroupIds: [ID!]!): [SubjectGroup!]!

  """
  Replace the people who **lead** one subject group.
  
  This one is a grant: it decides who fills the group's instances and — before publication — who
  reads the wishes on them. Refused with `NOT_A_SUBJECT_GROUP_LEAD` for somebody who does not hold
  the role, because a scope without the grant it scopes is a row the database refuses anyway and a
  sentence is more use than a constraint violation.
  
  An empty list is allowed and means nobody leads this group, which is the state a fresh group is
  in. It is the thing `subjectGroupsWithoutLead` counts, and the thing "keine Fachgruppe ohne
  Person, die sich ihrer annimmt" asks somebody to finish.
  
  The mirror image is also true and is the reading this system takes everywhere it can: a lead with
  no group may do **nothing**, not everything. The role that means every group is the dean's
  office.
  """
  setSubjectGroupLeads(id: ID!, personIds: [ID!]!): SubjectGroup!

  """
  Register your interest in an instance, or change it.
  
  Yours only: there is no argument for whose it is. Registering twice for the same instance is not
  a second wish and not an error — it is a correction, and it keeps the original `createdAt`.
  
  Only in the wish phase. `WISH_PHASE_CLOSED` otherwise, in either direction: a list that may be
  added to but not corrected is worse than a closed one, so both are the same decision about when
  the window is open.
  
  Reachable through both doors, unlike the demand: this is your own data.
  """
  setWish(
    """The instance you are interested in."""
    courseInstanceId: ID!
    priority: WishPriority! = HAPPY_TO

    """Up to 500 characters, or nothing at all."""
    note: String
  ): Wish!

  """
  Withdraw one of your own wishes.
  
  A wish that is not there and a wish that is not yours answer the same way, with
  `WISH_NOT_FOUND` — which of the two it is, is the confidential part.
  
  Returns the id, so that a list can drop the row without asking again.
  """
  withdrawWish(id: ID!): ID!

  """
  Fetch the module master data now and apply it.
  
  Refused if a run is already going — the one in progress is returned instead of a second one
  being started — and refused for a while after a successful run, because this reaches into
  another institution's system and a button that can be held down should not be able to hammer
  it.
  
  Interactive only. It is an outbound call using a shared credential, and the record of who
  asked for it should be a person who signed in rather than a token in a script.
  """
  syncZpaNow: ZpaSyncRun!

  """
  Rebuild the module catalogue from the payloads already cached, without fetching anything.
  
  For when the rules of the projection change: a new rule has to be applicable to data already
  held, without waiting for the nightly job and without asking another institution's system for
  3861 objects that have not moved.
  
  Unlike `syncZpaNow` this reaches nothing outside this database, so there is nothing to hammer
  and no cooling-off period. Interactive only all the same — it rewrites the catalogue everybody
  plans with, and that should be attributable to somebody who signed in.
  """
  projectZpaCatalogue: ZpaCatalogueProjection!
}

"""
A person in the planning.

Carries identity and roles, nothing else. Teaching load and notes about people are not
reachable here — see the `@interactiveOnly` note in the API documentation.
"""
type Person {
  id: ID!

  """
  The address the university's login asserts. Case-insensitive, and the key we match on.
  """
  mail: String!
  name: String!

  """
  Surname first, for a list — `Braun, Oliver` where `name` is `Prof. Dr. Oliver Braun`.
  
  Taken from the list the examination office publishes, matched on the address, and `null` for
  everybody it does not know: which word of a written-out name is the surname is not something to
  guess at. A list falls back to `name` for those, which is why they are still in it.
  
  Only the administration reads fill this in. It is a name for a list, and nothing else needs
  one — `me` answers `null` here whoever asks.
  """
  sortName: String

  """
  Whether this account can be used at all.
  
  An inactive person is refused at both doors, whatever roles they hold — deactivating is the
  removal this system has, and it takes away every token in the same moment. Nobody is ever
  deleted: the assignments they held stay in the history.
  """
  active: Boolean!

  """The roles this person holds, in a stable order."""
  roles: [Role!]!

  """
  The study programmes this person's study-programme leadership applies to.
  
  Empty for everybody who does not lead one — and empty for a lead nobody has assigned a
  programme to yet, which is a state with consequences rather than a gap: such a lead may
  declare no demand at all. An empty list here is **not** "every programme". The role leads
  one; the role that means all of them is the dean's office.
  
  Readable through both doors, like `roles`: which programmes you may plan is the first thing a
  script needs to know, and on `me` it is your own data.
  """
  programmes: [Programme!]!
}

"""
A Personal Access Token, as its owner sees it.

The secret is not here and never will be: the server keeps only a checksum of it, so no query
can hand it out a second time.
"""
type PersonalAccessToken {
  """
  The public half of the token — the part between the two underscores in `tallox_…_…`.
  
  Safe to write down, safe to read out over the phone. It identifies the token in this list
  and in the audit log, and it is what you pass to `revokePersonalAccessToken`.
  """
  id: ID!

  """
  What you called it. Shown in the list, so that revoking the right one is not guesswork.
  """
  description: String!

  """
  The `area:verb` grants this token carries — see the `@scope` directive.
  
  **An empty list means unrestricted**: the token may do everything its owner's roles allow.
  Scopes only ever narrow. There is currently no way to choose them when creating a token, so
  in practice this list is empty; the enforcement is live, and tokens created now keep working
  when the choice arrives.
  """
  scopes: [String!]!
  createdAt: Time!

  """
  When this token stops working. There is no token without an expiry: 90 days by default, 365
  at most.
  """
  expiresAt: Time!

  """
  Roughly when the token was last used, or `null` if it never was.
  
  Deliberately coarse — it is only updated when the previous value is more than five minutes
  old. It answers "is this still in use, can I revoke it", which is what it is for.
  """
  lastUsedAt: Time

  """When it was withdrawn, or `null` while it still works."""
  revokedAt: Time
}

"""
Where a semester stands in the planning process.

The phase is stored and switched deliberately, never derived from the calendar. Dates slip,
and a process that moves on because a Tuesday arrived is one nobody trusts — this way the
switch is an act somebody performs, visibly and at a moment everyone can point at.

A semester moves **one step at a time**, forwards or backwards. Backwards is the correction:
reopening a plan is a normal thing for a faculty to do, and it should happen in the tool rather
than around it.
"""
enum Phase {
  """The programme leads declare which instances have to be offered."""
  DEMAND_PLANNING

  """
  Lecturers register interest. Entries are confidential until they are published
  — which is a separate decision, see `wishesPublishedAt`.
  """
  WISHES

  """The subject group leads fill the instances."""
  ASSIGNMENT

  """The plan stands. Changes from here on are corrections, not planning."""
  FINAL
}

"""One rule, and what it answers for this person."""
type PolicyDecision {
  """
  The rule, named as it is named in the source — so that a report can be acted on.
  """
  rule: String!

  """What the rule answers for this person right now."""
  allowed: Boolean!

  """
  Why, in a sentence somebody without the source in front of them can use.
  """
  reason: String!
}

"""
A study programme of the faculty.

Addressed by its short code — IF, IG, DA, DC — which is the name the faculty says out loud and
the examination office publishes. The same argument `Semester.code` makes: short, stable, and
belongs in a URL and in a colleague's script.
"""
type Programme {
  """IF, IG, DA, DC. Upper case, at most ten characters."""
  code: String!

  """
  The long name, maintained here rather than imported.
  
  The examination office publishes no long name — the field that looks like one carries the code
  again — so this is written by a person and the nightly import never touches it. Empty until
  somebody types one, and an interface should fall back to the code.
  """
  title: String!

  """
  False for a programme the examination office publishes no current regulations for.
  
  One such programme exists. Its modules are still planable, which is why it is here at all
  rather than treated as a data error; it simply does not belong in a picker.
  """
  active: Boolean!

  """
  Whether this faculty plans this programme — its own decision, not the examination office's.
  
  The catalogue holds every programme the regulations mention, and some of them this faculty
  does not plan: `NOT_OURS` is somebody else's, `DISCONTINUED` is one of ours that has run out.
  Both stay in the catalogue — their modules are still taught, and what was planned in them
  stays on record — and neither is offered in a picker or may be granted to a programme lead.
  
  **It cannot be derived, and that was measured.** The newest regulations of two planned
  programmes are from 2010, older than every programme on the other list; the discontinued one
  with the most active modules has more of them than three that are planned; and the programme
  object the source carries holds a code and nothing else.
  """
  planningStatus: ProgrammeStatus!

  """Its versions of the examination regulations, newest first."""
  spos: [Spo!]!
}

"""Whether this faculty plans a study programme."""
enum ProgrammeStatus {
  """
  This faculty plans it. The default for a programme the import has just brought in.
  """
  PLANNED

  """
  Somebody else's programme. It is in the catalogue because its regulations mention modules.
  """
  NOT_OURS

  """
  This faculty's, and it has run out.
  
  Kept apart from `NOT_OURS` although the two do the same thing today: this one has demand on
  record and students still finishing, and "what did we offer in it" is a question it has to be
  able to answer.
  """
  DISCONTINUED
}

"""
Everything that can be read.

Start with `me` to check that your token works and to see which roles you hold — the roles
decide what the rest of these fields answer.
"""
type Query {
  """
  Which version of the server is answering.
  
  Works without authentication, so it is also the simplest way to check that a token, a
  network route or a proxy is doing what you expect: if this answers and nothing else does,
  the problem is the credential and not the connection.
  """
  buildInfo: BuildInfo!

  """
  One page of the access log, newest first.
  
  Paged by cursor rather than by offset: the log grows at the head while somebody is reading it,
  and an offset would silently skip or repeat rows exactly when it is busiest — which is when
  somebody is most likely to be reading it. Pass the `id` of the last entry of the previous page
  as `before`.
  """
  accessLog(filter: AccessLogFilter, limit: Int = 100, before: ID): [AccessLogEntry!]

  """
  The figures for one window.
  
  Separate from `accessLog` rather than a field on it, because the figures are over the whole
  window and the entries are one page of it. A count that agreed with the page would be a count
  of the page.
  """
  accessSummary(from: Time!, until: Time!): AccessSummary

  """
  Everybody this installation knows.
  
  `search` matches a substring of the mail address or the name. `includeInactive` brings back
  the people who have been deactivated; they are hidden by default because the list is
  otherwise mostly leavers after a few years.
  """
  people(search: String, includeInactive: Boolean): [Person!]

  """One person, or `null` if there is nobody with that id."""
  person(id: ID!): Person

  """
  One person's role grants, expired ones included.
  
  Separate from `Person.roles`, which is the set in force right now. The two answer different
  questions and merging them would lose the one this is for.
  """
  roleGrants(personId: ID!): [RoleGrant!]

  """
  Why a given person sees what they see.
  
  Takes the mail address rather than an id, because the question arrives as "Kollegin X says
  she cannot see the demand planning" and the address is what the asker has.
  """
  diagnoseAccess(mail: String!): AccessDiagnosis

  """
  Everybody who teaches, with the account each of them has here.
  
  The list to admit people from: it is who the examination office says teaches at this faculty,
  and next to each of them whether they can sign in. Unfiltered on purpose — a few hundred rows,
  and which of them anybody wants to see is a question the screen answers, not this field.
  
  Two things it does differently from `teachers`. It keeps the people the examination office
  marks as no longer teaching, because somebody who has left is exactly who an account has to be
  closable for. And it leaves out the ones a successful import stopped mentioning altogether.
  
  It is not the list of accounts. Somebody who may sign in without teaching — the dean's office,
  a secretariat — has no entry here at all, and `people` is where they are.
  """
  teacherAccounts: [TeacherAccount!]

  """
  What the caller has been given to teach — in one semester, or in every semester.
  
  The semester is optional here and required on `assignments`, the same asymmetry `myWishes` has
  and for the same reason: this is the one question whose answer never depends on the
  confidentiality rule. One's own assignments are visible to oneself in every semester and every
  phase, so there is no publication date to resolve — and inventing one would mean applying a
  single semester's state to all of them.
  
  Reachable through both doors. This is your own timetable, and building a calendar from it is the
  first script a colleague will write.
  """
  myAssignments(
    """Four digits, a hyphen and SS or WS. Omit for every semester."""
    semester: String
  ): [Assignment!]!

  """
  The assignments of one semester that the caller may see.
  
  The semester is required, because the rule *is* per semester: one may be published and the next
  not, so a filter built without knowing which would be a filter for the wrong one.
  
  Asking for somebody else's assignments is not refused — it narrows the same filtered set and
  answers with what was visible anyway. A refusal here would turn the filter into an oracle, since
  the difference between "refused" and "empty" is the fact being protected.
  """
  assignments(
    """Four digits, a hyphen and SS or WS, for example `2027-SS`."""
    semester: String!

    """Narrow to one study programme's instances, by code."""
    programme: String

    """Narrow to one module across its cohorts."""
    module: ID

    """Narrow to a single cohort of one module."""
    instance: ID

    """
    Narrow to one person's assignments. Matches an account, not a teacher without one.
    """
    person: ID
  ): [Assignment!]!

  """
  The study programmes this faculty plans, by code.
  
  Includes the one with no current regulations, marked `active: false`, because its modules are
  still planable. Excludes the ones the faculty does not plan — see `Programme.planningStatus`
  — because a picker built from this list would otherwise ask somebody to plan a programme
  nobody here runs.
  
  Pass `includeUnplanned: true` for all of them. That is what the screen deciding the statuses
  asks for, and what a script asking "what does the catalogue hold" wants.
  """
  programmes(
    """Add the programmes this faculty does not plan."""
    includeUnplanned: Boolean! = false
  ): [Programme!]!

  """
  One study programme by its short code, or `null` if there is no such programme.
  """
  programme(code: String!): Programme

  """
  The module catalogue, filtered.
  
  Requires an account and no particular role: the catalogue is published by the examination
  office and a lecturer has to see a module before they can register interest in it.
  """
  modules(filter: ModuleFilter): [Module!]!

  """One module by its id, or `null`."""
  module(id: ID!): Module

  """
  The people who teach, as the examination office publishes them.
  
  Not the users of this installation — see `Teacher`. Readable by anybody with an account: it
  is who teaches at the faculty, and a lecturer looking for the person responsible for a
  module needs it.
  """
  teachers(
    """Substring of the name or of the address. Case-insensitive."""
    search: String

    """Include the ones the examination office marks as no longer teaching."""
    includeInactive: Boolean = false
  ): [Teacher!]!

  """
  The demand of a semester: which instances have been declared, with their parts.
  
  The semester is required and has no default. Without one this would be a question about every
  semester at once, which is not a screen anybody wants and is a large answer to produce by
  accident.
  """
  courseInstances(
    """Four digits, a hyphen and SS or WS, for example `2027-SS`."""
    semester: String!

    """
    One study programme, by its short code. Omit for every programme's demand in that semester.
    """
    programme: String

    """One module, across its cohorts."""
    module: ID
  ): [CourseInstance!]!

  """One course instance by its id, or `null`."""
  courseInstance(id: ID!): CourseInstance

  """
  Who you are, as far as this server is concerned — or `null` if you are not signed in.
  
  The field to start with when writing a script: getting a person back means the token is
  valid, its owner is active, and these are the roles the rest of your queries will be judged
  by. It is the same field the web interface uses, so it cannot answer differently there.
  """
  me: Person

  """
  Which study programmes have announced their demand as settled, for one semester.
  
  Programmes that have not are simply absent. There is no "in Arbeit" row, because not announcing
  and withdrawing an announcement are the same state: the demand is not settled.
  """
  demandCompletions(
    """Four digits, a hyphen and SS or WS, for example `2029-SS`."""
    semester: String!
  ): [DemandCompletion!]!

  """
  The subject groups whose wish round somebody has switched, for one semester.
  
  The exceptions and not the whole list: a group that is not here is open. Reading it as "these are
  the open ones" is the mistake this field's shape invites, and the reason the sentence is here.
  """
  wishWindows(
    """Four digits, a hyphen and SS or WS."""
    semester: String!
  ): [WishWindow!]!

  """
  The semesters worth showing, newest first.
  
  Three sources, and each covers what the others get wrong:
  
  * **The semester being planned** (`planningSemester`), always — even if the calendar window
    does not reach it. It is the answer to "which one do you mean", so a list without it offers
    everything except the thing being worked on.
  * **The calendar window from there onwards**, three years out. Forwards only: before the
    planning semester there is nothing left to plan, and a list that opens on eight finished
    semesters makes the one that matters the hardest to find.
  * **Every semester anybody has decided something about**, however old and however far out. A
    plan made for five years ahead took a deliberate act to record, and a finished one is the
    record of what the faculty did.
  
  That last half also covers "every semester with demand" without a second question, because
  declaring demand records the semester in the same transaction it writes the demand in.
  
  While no planning semester is set, the whole calendar window stands — a fresh installation
  gets a usable list rather than an empty one.
  
  The calendar decides what is *offered* here and nothing else; the phase of each one is still
  a decision somebody made. Use `semester(code:)` for anything outside this window.
  
  Requires a signed-in identity — like everything except `buildInfo` — but no particular role:
  which semester is in which phase is the answer to "may I enter my wishes yet", and hiding it
  would produce a tool that refuses writes without saying why.
  """
  semesters: [Semester!]!

  """
  The semester the faculty is planning right now, or `null` while nobody has said.
  
  `null` is a real state and not a failure: a fresh installation is in it, and an interface
  that has to render a preselection needs to tell the two apart. `semesters` falls back to the
  whole calendar window while it lasts.
  
  Requires an account and no particular role, like the phase: it is the answer to "which
  semester is this about", and every screen needs it before it can show anything.
  """
  planningSemester: Semester

  """
  One semester by its code — always an answer, never `null`.
  
  There is no "no such semester": `2031-SS` names a stretch of time that will happen, and
  saying it does not exist would be false in the ordinary sense of the word. Only a malformed
  code (`SEMESTER_CODE_INVALID`) or one more than ten years from now
  (`SEMESTER_OUT_OF_RANGE`) is refused.
  """
  semester(code: String!): Semester!

  """
  How this request is being judged: identity, effective roles, and whether they were narrowed.
  
  Answers for anonymous callers too, with `person: null` and no roles — the interface renders
  a signed-out state from it rather than from a failed query.
  """
  session: Session!

  """
  The subject groups of the faculty.
  
  Readable by anybody with an account, like the catalogue and the demand: who leads mathematics is
  not confidential inside the faculty, and a lecturer who cannot see the groups cannot be shown
  their own subjects on the wish screen. What is administered is writing them.
  """
  subjectGroups(
    """
    Include the groups that have been retired. They are left out by default.
    """
    includeInactive: Boolean = false
  ): [SubjectGroup!]!

  """One subject group by its id, or `null`."""
  subjectGroup(id: ID!): SubjectGroup

  """
  The subject groups **you** are a member of.
  
  Your own data, through both doors. This is what the wish screen filters by: it offers your own
  subjects first, and it is a preselection rather than a rule — registering interest outside your
  groups stays possible, because FWP wildcards, teaching for another programme and simply moving
  into a new subject are all real. The repair for the last one is joining the group, not meeting a
  refusal.
  
  Retired groups are left out: a wound-up group is not a subject you are currently working in.
  """
  mySubjectGroups: [SubjectGroup!]!

  """
  How many active modules have no subject group yet.
  
  The work list, on its own, so that a screen can show the number without loading the modules.
  """
  modulesWithoutSubjectGroup: Int!

  """
  How many active subject groups have nobody leading them.
  
  "Keine Fachgruppe ohne Person, die sich ihrer annimmt", as a number rather than as a constraint
  — which is what makes it a task somebody can finish instead of a reason a group cannot be
  created.
  """
  subjectGroupsWithoutLead: Int!

  """
  Your own tokens. Never anybody else's.
  
  `null` through a Personal Access Token — see `@interactiveOnly`. The rest of the query still
  answers, so this field can be asked for speculatively without breaking anything.
  """
  myTokens: [PersonalAccessToken!]

  """
  Your own wishes — in one semester, or in every semester you have entered anything for.
  
  The one question whose answer never depends on the confidentiality rule, through either door:
  they are your entries. A script that keeps your wishes in step with your calendar is a use this
  API exists for.
  
  `semester` is optional here and required on the field below, and that asymmetry is the rule
  rather than convenience. The confidentiality filter is built from *one* semester's publication
  date, so a query spanning all of them would have to pick one date and apply it to the rest. Own
  entries have no such state to get wrong: they are visible to their owner in every semester and
  in every phase.
  """
  myWishes(
    """
    Four digits, a hyphen and SS or WS, for example `2027-SS`. Omit it for every semester.
    """
    semester: String
  ): [Wish!]!

  """
  The wishes of a semester — as many of them as you may see.
  
  **Not an error when you may see none.** Asking for a colleague's wishes before publication
  answers with an empty list rather than a refusal, and that is deliberate: the difference between
  "refused" and "empty" is exactly the fact being protected, so a refusal would turn this field
  into an oracle for it.
  
  Through a Personal Access Token this collapses to your own entries whatever your role — a
  long-lived token in a script makes silent bulk export possible and decouples "who saw this" from
  any login event. Your own stay readable, because they are your data.
  """
  wishes(
    """Four digits, a hyphen and SS or WS, for example `2027-SS`."""
    semester: String!

    """One study programme's instances, by its short code."""
    programme: String

    """One module, across its cohorts."""
    module: ID

    """One cohort of one module."""
    instance: ID

    """One person's entries, by id."""
    person: ID
  ): [Wish!]!

  """
  The recent import runs, newest first.
  
  The one worth looking at is the most recent **successful** one and how long ago it was. The
  failure this import will actually have is not a wrong result — it is a job that quietly
  stopped weeks ago, while everything looks healthy and the planning uses stale data.
  """
  zpaSyncRuns(limit: Int = 20): [ZpaSyncRun!]!

  """One import run, or `null` if there is no such run."""
  zpaSyncRun(id: ID!): ZpaSyncRun

  """What one run changed."""
  zpaChanges(runId: ID!): [ZpaChange!]!

  """
  The recent rebuilds of the module catalogue, newest first.
  
  Worth looking at beside `zpaSyncRuns` rather than instead of it. A successful import with a
  failed projection means fresh payloads behind a stale catalogue, and only this field says so.
  """
  zpaCatalogueProjections(limit: Int = 20): [ZpaCatalogueProjection!]!
}

"""
One identity that was turned away, grouped over the window.

Grouped rather than listed: somebody whose account has no person row will retry, and twelve
identical lines say nothing that one line with a count does not.
"""
type RefusedSignIn {
  """
  The address the door was knocked on with, empty on the token door.
  
  Both this and `tokenId` can be empty at once: a credential too malformed to parse yields
  neither, and is still a knock at the door.
  """
  mail: String!

  """The public half of the token presented, empty on the browser door."""
  tokenId: String!

  """The refusal's error code, empty when the door did not name one."""
  reason: String!

  """Which mount was knocked on."""
  door: AccessDoor!

  """How often, over the window."""
  attempts: Int!

  """The most recent attempt."""
  lastAt: Time!
}

"""
A role somebody holds. Everybody holds `LECTURER`; the others come on top of it.

The values are English. The interface shows the German terms the faculty uses: Dozent:in,
Fachgruppenleitung, Studiengangsleitung, Dekanat.
"""
enum Role {
  """
  Teaches, keeps a profile and a competence profile, registers interest in instances.
  """
  LECTURER

  """Assigns the instances of one subject group."""
  SUBJECT_GROUP_LEAD

  """
  Declares the demand of one study programme: which instances are needed, and the catalogues.
  """
  PROGRAMME_LEAD

  """
  Reads across programmes for the import/export statistics, keeps the teaching-load traffic light.
  """
  DEANS_OFFICE

  """
  Administers people, roles and tokens. Not a reader of unpublished wishes.
  """
  ADMIN
}

"""
One role grant, as stored — including one that has already expired.

Deliberately unfiltered, unlike `Person.roles`. "DEANS_OFFICE, granted on Tuesday by X,
expired on Wednesday" is the answer to the only question this record gets asked: who could see
what, and when.
"""
type RoleGrant {
  """The role that was granted."""
  role: Role!

  """
  When it was granted. Refreshed when the same grant is re-issued with a new expiry.
  """
  grantedAt: Time!

  """
  Who granted it, or `null` for a grant no human decided — the reconciliation of the
  protected administrators from the configuration file, or a future import.
  """
  grantedBy: Person

  """
  When it stops taking effect, or `null` if it does not expire.
  
  A grant with a date on it is how somebody steps over a threshold and has the database step
  back over it for them. The intended use is "let me look at this until this evening", not a
  way to hold a role for a semester — a grant meant to last that long should be visible as a
  permanent one rather than as a date nobody rereads.
  """
  expiresAt: Time
}

"""
The part of the API a scope refers to.

Deliberately coarse: these are meant to be ticked in a dialog by somebody whose mind is on the
evaluation script they are about to write.
"""
enum ScopeArea {
  """
  What answers without an identity. Useful for checking that a route and a credential work
  when everything else is refused: if this answers and nothing else does, the problem is the
  token and not the connection.
  
  **A scope list cannot take this away.** What is behind it answers without any credential, so
  a token scoped away from it would reach less than an anonymous caller — and would lose the
  one field that tells a broken credential from a broken route. Listing it is never necessary.
  
  Fields: `buildInfo`.
  """
  PUBLIC

  """
  Your own identity and session: who you are, which roles you hold, and which of them you are
  being judged by.
  
  Fields: `me`, `session`.
  """
  PROFILE

  """
  The planning process: which semesters exist, where each one stands, the faculty's subject
  groups, and — as they arrive — the demand, the assignments and the statistics.
  
  The first area worth narrowing a token to. `PUBLIC` and `PROFILE` are you describing
  yourself; `TOKENS` and `ADMIN` are unreachable through a token at all.
  
  Fields: `semesters`, `semester`, `planningSemester`, `programmes`, `programme`, `modules`,
  `module`, `teachers`,
  `courseInstances`, `courseInstance`, `advanceSemesterPhase`, `setPlanningSemester`,
  `publishWishes`, `publishAssignments`,
  # setAssignment and clearAssignment are here and are @interactiveOnly: their refusals answer
  # "is this part taken", which through a token the read rule would not.
  
  `assignments`, `myAssignments`, `setAssignment`, `clearAssignment`,
  `setModuleComponents`, `createLocalModule`, `changeLocalModule`,
  `setProgrammePlanningStatus`, `declareCourseInstance`, `duplicateCourseInstance`,
  `changeCourseInstance`, `withdrawCourseInstance`, `addInstancePart`, `changeInstancePart`,
  `removeInstancePart`, `shareInstancePartAcrossTracks`, `splitInstancePartAcrossTracks`,
  
  # The coverage handshake is here and is @interactiveOnly for the same reason setAssignment is:
  # agreeing can answer `PART_ASSIGNED`, which says a part of the asking cohort is already filled.
  # Interactively that reveals nothing to somebody who may already read that programme's
  # assignments; through a token it would.
  
  `requestInstanceCoverage`, `acceptInstanceCoverage`, `releaseInstanceCoverage`,
  `copyDemandFromSemester`, `planDemand`,
  `demandCompletions`, `wishWindows`, `setDemandComplete`, `setWishWindow`,
  `subjectGroups`, `subjectGroup`, `mySubjectGroups`, `modulesWithoutSubjectGroup`,
  `subjectGroupsWithoutLead`, `setMySubjectGroups`.
  """
  PLANNING

  """
  Registering interest in instance parts, and reading what may be read of other people's.
  
  Its own area rather than part of `PLANNING`, because it is the one part of the planning somebody
  might sensibly want a token narrowed *to*: "this script keeps my wishes in step with my
  calendar" is a sentence a colleague would say, and it should not carry the demand of the whole
  faculty with it. The reverse matters more — an evaluation script scoped to `PLANNING` does not
  thereby reach anybody's wishes.
  
  What this area does **not** do is decide what is visible. Through a token the wish rule collapses
  to your own entries whatever the scope says: the area bounds the surface, the policy bounds the
  rows.
  
  Fields: `myWishes`, `wishes`, `setWish`, `withdrawWish`.
  """
  WISHES

  """
  Personal Access Token management. Not reachable through a token at all — those fields are
  `@interactiveOnly`, so that a leaked token cannot mint its successors.
  
  Fields: `myTokens`, `createPersonalAccessToken`, `revokePersonalAccessToken`.
  """
  TOKENS

  """
  Running the installation: user and role administration, the module import, and the access
  log. Also `@interactiveOnly`, for the same reason.
  
  The import is here rather than under `PLANNING` because what these fields expose is the
  operation — did the nightly job run, what did it change, run it now, what did it make of the
  untidy parts — and not the catalogue it produces. The catalogue itself is planning data and
  lives under `PLANNING`. An area of its own was considered and rejected: every field it could
  hold is unreachable through a token anyway, so it would be a promise in an enum that
  colleagues can read via introspection and never use.
  
  Fields: `people`, `person`, `roleGrants`, `diagnoseAccess`, `teacherAccounts`,
  `createPerson`, `renamePerson`, `setPersonRoles`, `setPersonActive`, `setPersonProgrammes`,
  `setTeacherAdmitted`, `zpaSyncRuns`, `zpaSyncRun`, `zpaChanges`, `zpaCatalogueProjections`,
  `syncZpaNow`, `projectZpaCatalogue`, `accessLog`, `accessSummary`,
  `createSubjectGroup`, `renameSubjectGroup`, `setSubjectGroupActive`, `setModulesSubjectGroup`,
  `setSubjectGroupMembers`, `setSubjectGroupLeads`.
  """
  ADMIN
}

"""One `area: verb` pair, when creating a token."""
input ScopeGrantInput {
  """
  Which part of the API. The fields belonging to each area are listed on `ScopeArea`.
  """
  area: ScopeArea!

  """
  `READ` for queries, `WRITE` for mutations — and `WRITE` includes `READ` in the same area.
  """
  verb: ScopeVerb!
}

"""Whether a scope permits reading or changing."""
enum ScopeVerb {
  """Queries."""
  READ

  """
  Mutations — and queries in the same area, because a token that may change
  something and not look at it is not a capability anybody wants.
  """
  WRITE
}

"""
One semester, and where its planning stands.

**Nobody creates a semester.** It is a name for a stretch of time and it is there the way next
March is there — `semesters` lists the ones near now, and every code within reach can be asked
about. What gets created is a *decision* about one: switching its phase, publishing its wishes.
A semester nobody has decided anything about is in `DEMAND_PLANNING` with its wishes
confidential, which is the start of the process and needs no act to arrive at.
"""
type Semester {
  """
  The semester in the form `2026-WS` or `2026-SS`: four digits, a hyphen and the term.
  
  The digits are the year the term *starts* in, so the winter semester 2026/27 is `2026-WS`.
  This is the spelling the faculty already uses — the examination office writes `WS 2026`, and
  the hyphen is here because a space has to be quoted in a URL, a filename or a shell argument.
  
  Sorts chronologically as plain text (`2026-SS` < `2026-WS` < `2027-SS`), which is why it is
  worth having in a filename or a script rather than the id.
  """
  code: String!

  """Where the planning stands."""
  phase: Phase!

  """
  Whether this is the semester the faculty is planning right now. At most one is.
  
  The answer to "which semester is this page about" before anybody has chosen one — a
  preselection for every screen and a default for every script, so that neither has to guess.
  
  **Not derived from `phase`.** The obvious rule, "the newest one that is not `FINAL`", is
  ambiguous exactly when it matters: while the summer is being assigned, the winter is already
  in demand planning and both are open. Which of the two is meant is a decision somebody takes,
  the same way the phase is.
  """
  isPlanningSemester: Boolean!

  """
  The phases this semester can be switched to right now — one step away, in either direction.
  
  Computed from the same rule the mutation enforces, so an interface can render exactly the
  buttons that will work.
  """
  reachablePhases: [Phase!]!

  """
  When the wishes of this semester became visible to everybody, or `null` while they are still
  confidential.
  
  Separate from the phase on purpose, and not tied to it: the wish phase can end without
  publishing, so that late entries stop while the planners work, and publication can happen
  while the assignment is already running.
  
  There is no un-publishing. Once colleagues have seen each other's entries, clearing this
  would only be a lie about it.
  """
  wishesPublishedAt: Time

  """
  When the assignments of this semester became visible to everybody, or `null` while they are
  still confidential.
  
  Its own mark, independent of the one above in both directions. The ordinary case is wishes
  published while the assignment is still being made — that is what lets it be made from a
  complete picture. The reverse is unusual and legitimate: a finished plan may be published to a
  faculty whose wishes were never made public at all.
  
  There is no un-publishing here either.
  """
  assignmentsPublishedAt: Time

  """
  When the last decision about this semester was recorded, or `null` while none has been.
  
  Not "when the semester was created" — nothing creates one. It is the phase switch or the
  publication that this timestamp belongs to, and `null` means the semester is simply sitting
  in the calendar, untouched. A repeated `publishWishes` does not move it.
  """
  decidedAt: Time
}

"""
How the current request is being judged.

Read this rather than `me` when the question is "what may I do right now": it accounts for a
role narrowing, which `me` deliberately does not.
"""
type Session {
  """
  Who you are, or `null` if you are not signed in. The same value as the `me` query.
  """
  person: Person

  """
  The roles this request is actually judged by.
  
  Equal to `grantedRoles` unless you asked to be narrowed. This is the list an interface
  should render its navigation from.
  """
  effectiveRoles: [Role!]!

  """
  The roles you hold, whatever you are currently being judged by.
  
  What you get back by ending the narrowing — which is why the control that ends it must not
  itself be hidden by the narrowing.
  """
  grantedRoles: [Role!]!

  """
  Whether you asked to be judged by fewer roles than you hold.
  
  `true` means what you are looking at is a preview and not your own view. Say so visibly:
  somebody who forgets they are narrowed will eventually report a missing feature as a bug.
  """
  narrowed: Boolean!

  """
  Whether this is a signed-in browser session rather than a Personal Access Token.
  
  `false` means the `@interactiveOnly` fields will answer `null` — worth checking before
  concluding that something is empty.
  """
  interactive: Boolean!
}

"""
One version of one study programme's examination regulations.

Present in this schema because a module counts *in* one, and because narrowing the catalogue to
one version is a useful question. It is deliberately **not** part of what identifies a course
instance — see `CourseInstance`.
"""
type Spo {
  id: ID!

  """The year, as the examination office numbers them: 2019, 2023, 2025."""
  version: Int!

  """The day this version starts applying."""
  validFrom: Date

  """
  The identifier the campus management system uses, for example `07-IF-2025`, or `null` while
  the version is still being entered.
  
  That emptiness is the only reliable signal that a version is unfinished, which matters because
  an unfinished one holds a fraction of its eventual modules and would otherwise look like a
  catalogue that lost most of them.
  """
  primussId: String

  """The study programme these regulations belong to."""
  programme: Programme!
}

"""
A subject the faculty groups modules and people by.

Three things hang off it and they are not the same thing:

* **Modules.** Exactly one group per module — "whose group fills this instance" is the sentence
  the whole assignment phase is made of, and it has to have one answer.
* **Members.** The colleagues who work in these subjects. This is **not** a permission: it decides
  what the wish screen offers first and nothing else.
* **Leads.** The colleagues who fill this group's instances — and, before publication, who read
  the wishes on them. This one *is* a grant.
"""
type SubjectGroup {
  id: ID!

  """
  The short name the faculty says out loud: `MATHE`, `SWE`, `TI`.
  
  What belongs in a URL and in a colleague's evaluation script, like a programme's code. Up to
  sixteen characters, so that a group split off another can carry a distinguishable suffix
  (`MATHE-ML`) instead of encoding it into the name.
  """
  code: String!

  """The name a person reads: `Mathematik (klassisch)`."""
  name: String!

  """
  False for a group that has been retired — split into two, or wound up.
  
  There is no delete and there will not be one. A retired group still has to render in the
  planning it was part of, and its modules keep their assignment: reassigning 506 modules is
  weeks of somebody's judgement, and a delete that took it would be silent.
  """
  active: Boolean!

  """
  The colleagues who lead this group, in the order a list reads.
  
  Empty is a real state, and the reason the faculty's "keine Fachgruppe ohne Person, die sich
  ihrer annimmt" is a work list here rather than a constraint: a group has to be creatable before
  its lead is decided, and a lead has to be revocable without destroying the group.
  
  A lead whose grant has expired is not in this list. The grant is what the scope narrows, so a
  scope outliving it would be a permission nobody granted.
  """
  leads: [Person!]!

  """
  The colleagues who work in this group's subjects.
  
  Readable by anybody with an account, and that is a decision rather than an oversight. The
  kickoff asks for it — "jeder in einer Fachgruppe müsste alles lesen können" — and who teaches at
  this faculty is already answerable through `teachers`. What that sentence does **not** extend to
  is unpublished wishes: those are read by the lead alone, because the first-come-first-served
  race the confidentiality rule ends plays out inside a subject group, not across them.
  
  Membership grants nothing. `policy.AssignmentScope` deliberately does not read it.
  """
  members: [Person!]!

  """
  How many modules are assigned to this group.
  
  Safe in a way a count over wishes never is: a module assignment is catalogue data, and nobody
  is protected from it being known.
  """
  moduleCount: Int!

  """
  Which modules the group holds, by name.
  
  Loaded only when asked for — one statement per group, and there are a handful of groups. That is
  the trade this repository makes explicitly rather than reaching for a loader: 506 modules is why
  the catalogue is batched, and ten groups is not.
  
  Retired modules are left out. A group is described by what it currently covers.
  """
  modules: [ModuleRef!]!
}

"""
What assigning a batch of modules did.

Reported as a number even when it is zero, because "nothing happened" and "it failed" are
indistinguishable to the person who pressed the button otherwise.
"""
type SubjectGroupAssignmentReport {
  """
  The group the modules were put into, or `null` where they were taken out of every group.
  """
  subjectGroup: SubjectGroup

  """How many module assignments were written or removed."""
  modulesAssigned: Int!

  """
  How many active modules still have no subject group at all.
  
  October's work list as a number: a bounded, finishable task, the same shape as "14 modules
  without a split". Retired modules are not counted — a module the examination office stopped
  publishing is not work anybody has to finish.
  """
  modulesWithoutSubjectGroup: Int!
}

"""
A subject group as it is referred to from somewhere else: enough to label it and to link to it.

Deliberately not the whole `SubjectGroup`. That one carries its leads and its members, and
filling those in for every row of a 506-module catalogue would be a statement per module. Having
a name for the reference is what stops a half-populated group being passed around as if it were a
whole one.
"""
type SubjectGroupRef {
  id: ID!

  """The short name the faculty says out loud: `MATHE`, `SWE`, `TI`."""
  code: String!

  """The name a person reads: `Mathematik (klassisch)`."""
  name: String!

  """
  False while this group is retired.
  
  Worth carrying rather than assuming: a module can sit in a retired group for as long as a split
  takes, and a screen that called it active would hide exactly the rows somebody is in the middle
  of moving.
  """
  active: Boolean!
}

"""
Somebody who teaches, as the examination office publishes them.

**Not a user of this installation.** Who may sign in is a separate, curated list — the people
administration — and importing this one grants nothing. The two are connected by the mail
address where both know it, which is also why a teacher the source gives no address for can
never be connected to anybody.
"""
type Teacher {
  id: ID!

  """The full name with its titles, as the examination office writes it."""
  name: String!

  """Surname first, for a list. Every one of them is in this form."""
  sortName: String!

  """
  The address, or `null` for the handful the source gives none for.
  
  Also the link to a person in this installation: where somebody with this address may sign
  in, that is the same human.
  """
  mail: String

  """Holds a professorship."""
  isProfessor: Boolean!

  """Teaches on a contract (Lehrbeauftragte:r)."""
  isLecturerOnContract: Boolean!

  """Holds an honorary professorship."""
  isHonoraryProfessor: Boolean!

  """Is staff. Not exclusive with the three above — somebody can be both."""
  isStaff: Boolean!

  """
  What the examination office says about the employment. Roughly four in five are true.
  
  Kept and shown rather than filtered on import: five of the people still named as responsible
  for a module are false here, and dropping them would leave those modules pointing at nobody
  for a reason nobody could see.
  """
  active: Boolean!

  """
  The faculty, where the source says one. Absent for more than half of them, so it is a hint
  and not a filter.
  """
  faculty: String

  """
  The last semester this person taught in, in this system's spelling — or `null` where the
  source says something that is not a semester.
  """
  lastSemester: String

  """
  Whether somebody with this address may sign in to Tallox.
  
  Derived from the address on every read rather than stored, so that somebody admitted this
  morning is connected to their own modules now rather than after the next import.
  """
  isUser: Boolean!
}

"""
Somebody the examination office publishes, together with the account they have here.
"""
type TeacherAccount {
  """
  The person as the examination office publishes them. Importing them granted nothing.
  """
  teacher: Teacher!

  """
  Their account here, or `null` if nobody of this address may sign in.
  
  An account somebody deactivated is **not** `null`: it is an account with `active: false`.
  The two look alike from outside and are not — one has never been admitted, the other has been
  admitted and had it taken away — and the next step differs accordingly.
  """
  account: Person
}

"""
A moment in time, as an RFC 3339 string — for example `2026-08-01T14:30:00+02:00`.

Always in Europe/Berlin, the timezone the planning runs in.
"""
scalar Time

"""
One person's interest in one course instance.

Points at an **instance** and never at one of its parts. "One holds the lecture, another the
laboratory" is true and stays true — it is what the *assignment* decides, one step later. A wish
is somebody offering to teach a subject for a cohort, and the part-level detail they have in mind
belongs in `note` until there is somebody to agree it with.
"""
type Wish {
  id: ID!

  """
  Who registered it.
  
  Always the person who made the call. There is no way to register interest on somebody's behalf
  and no column that would record one: a wish entered by somebody else is not an expression of
  interest but their opinion about you, and the process has a place for that — the assignment.
  """
  person: Person!

  """
  What is wanted: one module, in one study programme, for one cohort.
  
  Carried whole because a wish is unreadable without it — "Analysis, IF1B" is the row somebody
  recognises, and an id is not. Its `parts` are reachable from here for a screen that wants to
  show what the instance consists of; no wish points at one of them.
  """
  instance: CourseInstance!

  """How much."""
  priority: WishPriority!

  """
  The owner's own words: „nur die Vorlesung“, „lieber Zug B“, „nur wenn es sonst niemand macht“.
  
  This is where the part-level detail lives during the wish phase, and deliberately as prose
  rather than as structure: „ich mache die Vorlesung, das Praktikum jemand anderes“ is a proposal
  about two people, and turning it into a field would ask one of them to decide it alone.
  
  Read by whoever may read the wish — the same rule as the row, because it is part of the row.
  """
  note: String!

  """When it was first registered."""
  createdAt: Time!

  """
  When it was last changed. Changing your mind moves this and keeps `createdAt`.
  """
  updatedAt: Time!
}

"""
How much somebody wants an instance.

Three fixed levels rather than a rank. A rank is more expressive and costs a reordering dance on
every insert in the middle, and a number nobody can read off a list without a legend. Ties are the
common case: somebody wants four things equally and would rather say so than invent an order.
"""
enum WishPriority {
  """Unbedingt — what somebody is actually asking for."""
  FIRST_CHOICE

  """
  Gerne. The default, because it is the honest answer to a form being filled in for the first time.
  """
  HAPPY_TO

  """
  Notfalls — held to fill a gap, and the level the assignment reads last.
  """
  IF_NEEDED
}

"""
One subject group's wish round, for one semester.

Only groups somebody has decided something about appear. Absent means open.
"""
type WishWindow {
  """The semester it is about."""
  semester: String!

  """The subject group whose wish round this is."""
  subjectGroup: SubjectGroupRef!

  """
  Whether entries are being taken.
  
  A row that says `true` is one that was shut and opened again — kept rather than deleted, so that
  the second decision is visible.
  """
  open: Boolean!

  """When it was last switched."""
  changedAt: Time!
}

"""One rebuild of the module catalogue out of the cached payloads."""
type ZpaCatalogueProjection {
  id: ID!

  """
  The import run that triggered this, or `null` for a projection somebody asked for on its own.
  
  Both happen: every successful import projects, and the rules of the projection change often
  enough that applying a new one to data already held has to be possible.
  """
  runId: ID

  """
  When it started. Written before the first statement, so a projection that crashed is still visible.
  """
  startedAt: Time!

  """When it ended, or `null` while it is still going."""
  finishedAt: Time

  """How it ended."""
  status: ZpaProjectionStatus!

  """How many study programmes were written."""
  programmesWritten: Int!

  """How many teachers were written."""
  teachersWritten: Int!

  """How many modules were written."""
  modulesWritten: Int!

  """
  How many entries of 'this module counts in these regulations' were written.
  """
  offeringsWritten: Int!

  """
  How many such entries were removed because the source stopped supporting them.
  
  The only thing a projection deletes, and it is safe because nothing points at one. A module
  that disappears keeps its row and gains a retirement date instead.
  """
  offeringsRemoved: Int!

  """Why it failed, or `null`."""
  error: String

  """What the projection made of the parts of the source that are not tidy."""
  notes: [ZpaProjectionNote!]!
}

"""
One line of a run's report.

Deliberately without the payloads. They are kept in the database for the durable answer months
later, but shipping two documents per line into a list is a great many bytes for a view that
renders field names.
"""
type ZpaChange {
  id: ID!

  """Which kind of object."""
  kind: ZpaObjectKind!

  """The object's identifier in the examination office's database."""
  zpaId: String!

  """
  A human-readable name, or `null` when the payload carries none.
  
  Modules have none today: their objects carry no name field at all, and the name exists only
  inside the nested object of an association row.
  """
  label: String

  """What happened to it."""
  change: ZpaChangeType!

  """
  The top-level fields whose content differs, for a change; empty otherwise.
  
  Field names only. This is what turns "the content differs" into something readable — "the
  hours per week and the person responsible changed" rather than two documents side by side.
  """
  changedKeys: [String!]!

  """When this was noticed."""
  detectedAt: Time!
}

"""What happened to one object in one run."""
enum ZpaChangeType {
  """Seen for the first time."""
  APPEARED

  """Already held, and its content differs."""
  CHANGED

  """
  A successful fetch no longer mentions it.
  
  Only ever recorded after a fetch that succeeded and returned something, so that one bad night
  cannot retire a whole catalogue.
  """
  DISAPPEARED

  """
  It had disappeared and is back. The same record, with the day it was first seen intact.
  """
  REAPPEARED
}

"""What kind of object the examination office's interface published."""
enum ZpaObjectKind {
  """
  A module in the catalogue, with its home programme, course type and credits.
  """
  MODULE

  """
  A catalogue slot inside one version of a programme's examination regulations — compulsory or
  elective, and possibly belonging to a specialisation.
  """
  BASKET

  """
  The association between a module, a set of examination regulations and a basket. The module
  code and the earliest programme semester live here rather than on the module, because both
  differ between the programmes a module appears in.
  """
  MSBA

  """One version of one programme's examination regulations."""
  SPO

  """
  Somebody who teaches. The list a module's responsible person is named from — and, alone
  among the five, an endpoint whose values are actually typed.
  
  Importing these grants nobody access: who may use this installation is a separate, curated
  list.
  """
  TEACHER
}

"""
One decision the projection made about input the examination office left untidy.

Every one of these is a decision with a reason, and none of them is a silent drop: a projection
that quietly discarded rows would be indistinguishable from a catalogue that never had them, and
the first person to notice would be a programme lead who cannot find a module they are
responsible for.
"""
enum ZpaProjectionFinding {
  """
  Skipped: the source names no home programme for the module, and every module has exactly one.
  """
  MODULE_WITHOUT_HOME_PROGRAMME

  """Skipped, with its modules: a programme code this system cannot store."""
  PROGRAMME_CODE_MALFORMED

  """
  Not projected: the association points at regulations the source no longer publishes.
  
  The largest of these by far, and mostly historical. There is no path from such a row to a
  programme, so it cannot become an entry in a module's list of where it counts.
  """
  ASSOCIATION_WITH_UNKNOWN_REGULATIONS

  """
  Kept, and marked inactive: a programme named only by the modules that call it home.
  
  Its modules stay planable, which is why it is kept at all rather than treated as an error.
  """
  PROGRAMME_WITHOUT_REGULATIONS

  """
  Kept with an empty name: the source's module records carry no name field, and this module
  appears in no set of regulations to borrow one from.
  """
  MODULE_WITHOUT_NAME

  """Kept and flagged: the examination office has retired the module."""
  MODULE_INACTIVE

  """
  Became `UNKNOWN`: a phrase for how often a module runs that this version does not recognise.
  """
  FREQUENCY_UNMAPPED

  """The same, for how the teaching is broken up."""
  COURSE_TYPE_UNMAPPED

  """
  Folded with the lower value: the catalogue slots of one set of regulations disagree about the earliest semester.
  """
  MIN_SEMESTER_CONFLICT

  """
  Not stored: the source names a responsible person the teacher list does not contain.
  
  About one module in thirty. Either a placeholder rather than a person, or the address of
  somebody who is not in the list. The value stays in the cached payload; carrying it into the
  catalogue would put a mail address in the tables about modules.
  """
  MODULE_RESPONSIBLE_UNKNOWN

  """
  Kept: somebody who teaches and for whom the source gives no address.
  
  The address is the link to somebody who signs in, so such a person can never be connected to
  one — worth seeing, not worth refusing.
  """
  TEACHER_WITHOUT_MAIL

  """
  The one that is an alarm rather than a note, and it should always be absent.
  
  A module's entry per set of regulations is folded from up to four catalogue slots, and that
  fold is only safe because the slots never disagree about compulsory-or-elective — measured at
  zero conflicts across the whole catalogue. If this appears, the fold has been picking an
  answer.
  """
  DUTY_CONFLICT
}

"""
One line of a projection's report: what it found, how often, and a few examples.

Counts and samples rather than a row per object. The useful sentence is "665 associations across
12 sets of regulations", and whoever wants to chase one needs a handful of identifiers rather
than all of them.
"""
type ZpaProjectionNote {
  """What was found."""
  finding: ZpaProjectionFinding!

  """How many objects it applies to."""
  count: Int!

  """
  Up to twenty examples: examination office identifiers, or the phrases that were not
  recognised, or the programme codes — whichever is the useful thing to look at for this
  finding.
  """
  sample: [String!]!
}

"""
How a projection of the catalogue ended.

Three values rather than the import's four. There is no `PARTIAL`: the whole projection is one
transaction, so either the catalogue moved or it did not.
"""
enum ZpaProjectionStatus {
  """Still going, or the process that started it did not finish."""
  RUNNING

  """The catalogue was rebuilt."""
  SUCCEEDED

  """Nothing was written. The catalogue is exactly as it was."""
  FAILED
}

"""One run of the module master data import."""
type ZpaSyncRun {
  id: ID!

  """What started it."""
  trigger: ZpaSyncTrigger!

  """
  The name of whoever asked for it, or `null` for the nightly job.
  
  A name rather than a `Person`, because that is all this answers: the question is "who set
  this off", not "tell me about them", and a link into the people graph from here would be a
  second route to person data with its own rules to get right.
  
  Only ever a person, never a token: asking for a run is an act with an effect outside this
  database, so it stays attributable to somebody who signed in.
  """
  startedBy: String

  """
  When it started. Written before the first fetch, so a run that crashed is still visible.
  """
  startedAt: Time!

  """When it ended, or `null` while it is still going."""
  finishedAt: Time

  """How it ended."""
  status: ZpaSyncStatus!

  """How many objects were fetched in total."""
  fetched: Int!

  """How many were seen for the first time, or came back after an absence."""
  appeared: Int!

  """How many already held objects had different content."""
  changed: Int!

  """How many a successful fetch stopped mentioning."""
  disappeared: Int!

  """Why it failed or was only partly applied, or `null`."""
  error: String

  """What each endpoint did."""
  kinds: [ZpaSyncRunKind!]!
}

"""What one endpoint did within a run."""
type ZpaSyncRunKind {
  """Which endpoint."""
  kind: ZpaObjectKind!

  """Whether this endpoint was applied."""
  status: ZpaSyncStatus!

  """How many objects it returned."""
  fetched: Int!

  """Why it failed, in the words the operator needs, or `null`."""
  error: String
}

"""How an import run ended."""
enum ZpaSyncStatus {
  """Still going, or the process that started it did not finish."""
  RUNNING

  """Every endpoint was fetched and applied."""
  SUCCEEDED

  """
  Some endpoints were applied and others failed.
  
  Not a failure: the ones that arrived are correctly up to date, and nothing belonging to an
  endpoint that failed was retired.
  """
  PARTIAL

  """Nothing was applied."""
  FAILED
}

"""What started an import run."""
enum ZpaSyncTrigger {
  """The nightly job."""
  SCHEDULE

  """Somebody asked for it."""
  MANUAL
}

