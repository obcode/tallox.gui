"""
Directs the executor to defer this fragment when the `if` argument is true or undefined.
"""
directive @defer(
  """Deferred when true or undefined."""
  if: Boolean = true

  """Unique name"""
  label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

"""
Marks a field that only answers in a signed-in browser session, never through a Personal
Access Token.

**On a nullable field you get `null`**, and the rest of your query still answers — so a script
that asks for something interactive-only alongside other fields keeps the other fields. On a
field that cannot be null, and on every mutation, the call is refused with the error code
`INTERACTIVE_ONLY`.

Behind it: teaching load and overtime, other people's unpublished wishes, free-text notes
about people, the audit log, and token management itself. A long-lived token in a script is a
different risk from a login: it makes silent bulk export possible and separates "who saw this"
from any sign-in. Token management is on the list because a leaked token that can mint its
successors would outlive its own expiry date.
"""
directive @interactiveOnly on FIELD_DEFINITION

"""
Indicates exactly one field must be supplied and this field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

"""
Which Personal Access Token scope a field requires.

Every field on `Query` and `Mutation` carries one. A token whose scope list does not cover
every root field of your operation is refused with the error code `INSUFFICIENT_SCOPE`, before
anything runs.

A fetched schema will not show you the annotations — introspection reports that this directive
exists, but not where it is applied. Each `ScopeArea` below therefore lists the fields that
belong to it.

Two things worth knowing before you mint a token:

- **`WRITE` includes `READ` in the same area**, and nowhere else. There is no scope that covers
  all areas; a token that needs several lists several.
- **A token with an empty scope list is not restricted** — it may do everything its owner's
  roles allow. Scopes only ever narrow, exactly like the role preview does.

A scope never widens anything. Your roles decide what you may see; the scope decides how much
of that this particular token may reach.
"""
directive @scope(
  """Which part of the API the field belongs to."""
  area: ScopeArea!

  """Whether reaching the field is a read or a change."""
  verb: ScopeVerb!
) on FIELD_DEFINITION

"""Exposes a URL that specifies the behavior of this scalar."""
directive @specifiedBy(
  """The URL that specifies the behavior of this scalar."""
  url: String!
) on SCALAR

"""
Why somebody sees what they see.

Answers with decisions, never with content: it says whether a rule lets this person past, and
it never reads the thing behind the rule. That is what makes it usable for the ordinary
support question — "why can my colleague not see this" — without becoming a way around the
confidentiality it is describing.
"""
type AccessDiagnosis {
  """The person the diagnosis is about."""
  person: Person!

  """
  An inactive person fails authentication on both doors, whatever roles they hold.
  """
  active: Boolean!

  """Their grants, expired ones included."""
  grants: [RoleGrant!]!

  """What the rules answer for this person, one entry per rule."""
  decisions: [PolicyDecision!]!
}

"""A sibling cohort's shared part, seen from the cohort it is held for."""
type BorrowedPart {
  """The part itself, as its owning cohort holds it."""
  part: InstancePart!

  """
  The cohort that owns the row — the A in "held together with IF3A".
  
  Empty is possible and means the sibling has no letter, which happens while somebody is in the
  middle of splitting a single cohort into two.
  """
  fromTrack: String!
}

"""Version and provenance of the running server instance."""
type BuildInfo {
  """Semantic version from the release tag, or `dev` in a local build."""
  version: String!

  """Git commit the binary was built from, or `none`."""
  commit: String!

  """Build timestamp in RFC 3339, or `unknown`."""
  builtAt: String!
}

"""
What copying a semester's demand did.

Reported even when nothing happened. A copy into a semester that already holds the same instances
writes nothing at all, and "nothing happened" is indistinguishable from "it failed" to the person
who pressed the button.
"""
type CopyDemandReport {
  """The semester copied from."""
  from: String!

  """The semester copied into."""
  to: String!

  """The study programme whose demand was copied."""
  programme: Programme!

  """How many instances were declared."""
  created: Int!

  """
  How many were already declared in the target and were left exactly as they are.
  
  A copy never overwrites work in the semester it copies into — including a cohort year somebody
  has since corrected there.
  """
  skipped: Int!

  """How many parts came with the new instances."""
  partsCreated: Int!

  """
  The demand of the target semester afterwards — the whole list, not only the new rows.
  
  So that a screen can render the result of the copy from the answer to the copy, rather than
  asking again and rendering a moment that is one round trip old.
  """
  instances: [CourseInstance!]!
}

"""
One module, offered in one semester, for one study programme, to one parallel cohort.

**This is what gets planned, and its parts are what get assigned.** The faculty's own sentence is
"one person holds the lecture, another the laboratory", so a wish and an assignment will point at
an `InstancePart` and never at the instance.

The identity is the semester, the module, the programme and the cohort. Two things are
deliberately not part of it:

* **The version of the examination regulations.** One lecture in the winter serves every valid
  version at once — students under IF-2019 and IF-2025 sit in the same room with the same
  person — so an instance per version would be the same event two to four times in every list.
  Where the version matters, it is a question about `Module.offerings`.
* **The kind of teaching.** A lecture and its laboratories are one instance with several parts,
  not several instances.

The cohort *is* part of it, and that is the one people are surprised by. An instance is normally
assigned to one person, and Software Engineering I runs in two cohorts held by two people — so if
the cohort were a multiplicity inside the instance, "assign IF3A to somebody" would not be a
sentence this schema could express.
"""
type CourseInstance {
  id: ID!

  """
  The semester, in this system's spelling: `2026-WS`.
  
  The year is the one the semester *starts* in, so the winter of 2026/27 is `2026-WS`.
  """
  semester: String!

  """
  Whose demand this is.
  
  Not necessarily the module's home programme. A module at home in one programme and offered by
  another is exactly what the dean's office's import/export figures are about, and the difference
  between the two declarations is the export.
  """
  programme: Programme!

  """
  The catalogue entry this is an offering of, with its split and its offerings attached.
  
  The same `Module` the catalogue serves, so that "is this compulsory here" and "how do its hours
  divide" are answerable on a demand screen without a second lookup.
  """
  module: Module!

  """
  The parallel cohort — the A in IF3A — and empty for a module that runs once, which is the
  ordinary case.
  
  The letter only. The label a person reads is the programme's code, the cohort year and this,
  assembled where they are read: storing the assembled string would denormalise two facts and go
  stale on the third.
  """
  track: String!

  """
  Which cohort year this is for — the 3 in IF3A — or `null` where nobody has said and the
  regulations do not either.
  
  Seeded from the regulations when the instance is declared and a decision afterwards, rather
  than derived on every read. Derived it would be a *set* rather than a number: 23 of 1076
  module/programme pairs disagree across versions of the regulations, and it would change
  retroactively when a new version lands, renaming a cohort that has already been taught.
  """
  programmeSemester: Int

  """
  The assignable units this cohort holds itself, in order.
  
  Made from the module's split when the instance is declared — one part per unit — and edited
  afterwards. The number of laboratory *groups* is a planning decision and lives here, not in the
  module: a two-hour laboratory in the split is one entry however many groups a cohort runs.
  """
  parts: [InstancePart!]!

  """
  Parts of a sibling cohort that are held for this one as well.
  
  The other half of `InstancePart.sharedAcrossTracks`. A lecture given once for IF3A and IF3B is
  one row, owned by one of them — and the other has to render it, or its screen shows a cohort
  with laboratories and no lecture and looks like a planning mistake.
  
  Never counted in `teachingHours`: the point of holding a lecture once is that it costs the
  faculty once.
  """
  borrowedParts: [BorrowedPart!]!

  """
  What this instance costs the faculty: the sum over the parts it holds.
  
  **Not the module's own `contactHoursPerWeek`**, which is what a student attends. A four-hour
  module running one lecture and three laboratory groups costs eight hours per cohort, and
  summing the module's figure would give four — a plausible-looking wrong answer.
  
  A part whose hours nobody has stated yet contributes nothing rather than making the sum
  unanswerable: an instance can be declared before the detail is settled, which is what a demand
  deadline that comes before the detail requires.
  """
  teachingHours: Float!

  """When this instance was declared."""
  createdAt: Time!

  """When it was last changed."""
  updatedAt: Time!
}

"""
How the teaching of a module is broken up, as the catalogue describes it.

The template a module's split is proposed from, and nothing more: it does not say how the hours
divide and it does not say how many parallel groups there are. The first is stated once per
module in `ModuleComponent`; the second is decided per instance.
"""
enum CourseType {
  """
  Seminar-style teaching with a laboratory. The largest group in the catalogue.
  """
  SU_WITH_LAB

  """Seminar-style teaching with an exercise class."""
  SU_WITH_EXERCISE

  """A seminar."""
  SEMINAR

  """A laboratory on its own."""
  LAB

  """Seminar-style teaching on its own."""
  SU

  """An exercise class on its own."""
  EXERCISE

  """A project."""
  PROJECT

  """
  Independent work — a thesis, a study project. Usually carries no hours per week at all.
  """
  SELF_STUDY

  """
  The catalogue declining to say, for a slot whose content varies. Also the value anything unrecognised becomes.
  """
  DEPENDS_ON_SUBJECT
}

"""
A newly created token: the record, and the one and only sight of the secret.
"""
type CreatedPersonalAccessToken {
  """The token as it will appear in your list from now on."""
  token: PersonalAccessToken!

  """
  The complete token, `tallox_<id>_<secret>` — put this in your script's environment.
  
  Shown once, here, and never again: the server keeps only a checksum. If you lose it, revoke
  this token and create another one. That is a two-second inconvenience, and it is the reason
  a leak of the database is not a leak of anybody's credentials.
  """
  secret: String!
}

"""
A calendar day, in the form `2026-10-01`.

Not an instant. Regulations that apply from the first of October do not apply from midnight,
and a deadline sent as a timestamp would let a reader's timezone decide which day was meant.
"""
scalar Date

"""A demand about to be declared."""
input DeclareCourseInstanceInput {
  """
  Four digits, a hyphen and SS or WS, for example `2027-SS`. Upper-cased and trimmed for you.
  """
  semester: String!

  """The study programme whose demand this is, by its short code."""
  programme: String!

  """
  The module, by id.
  
  It must have a split — `Module.components` — because the instance's parts are made from it.
  Without one the answer is `MODULE_NOT_DECOMPOSED`, and the repair is `setModuleComponents`.
  """
  moduleId: ID!

  """
  The parallel cohort, or empty for a module that runs once. One to three characters, upper-cased
  and trimmed for you.
  
  Leave it empty at first: turning one cohort into two is `duplicateCourseInstance`, which names
  both letters at once.
  """
  track: String = ""

  """
  The cohort year, or `null` to take what the programme's regulations say — the earliest semester
  the module may be taken in, across every version of them.
  """
  programmeSemester: Int
}

"""
Whether a module is compulsory or elective in a study programme.

Three-valued rather than a boolean, because asked about a programme without naming a version of
its regulations the honest answer is sometimes neither. Measured over the whole catalogue, four
modules are compulsory under one version and elective under another — picking one silently would
be wrong for those four and unexplainable to whoever is looking at them.
"""
enum DutyStatus {
  """Compulsory under every version of the regulations asked about."""
  COMPULSORY

  """Elective under every version asked about."""
  ELECTIVE

  """Compulsory under some versions and elective under others."""
  MIXED
}

"""
How often a module is offered.

Useful as a filter: a module taught only in the summer is not a candidate for a winter
semester's demand, and 89 of them are. Three of the values say nothing about the term and
together are more than half the catalogue, so a term filter that hid them would remove most of
what somebody is looking for — see the note on `ModuleFilter.frequency`.
"""
enum Frequency {
  """Offered in both terms."""
  EVERY_SEMESTER

  """Offered in winter terms only."""
  EVERY_WINTER_SEMESTER

  """Offered in summer terms only."""
  EVERY_SUMMER_SEMESTER

  """
  Takes turns with other subjects of the same subject group. Which term it lands in is a
  decision inside the group rather than a rule, so it is not a term restriction.
  """
  ALTERNATING_WITHIN_SUBJECT_GROUP

  """Offered when it is announced. The largest group in the catalogue."""
  ON_ANNOUNCEMENT

  """
  The catalogue says nothing, or says something this version of the software does not
  recognise. The two are distinguished on the import page rather than here.
  """
  UNKNOWN
}

"""
One assignable unit of an instance: a lecture, a laboratory group, a seminar.

What a wish and an assignment will point at.
"""
type InstancePart {
  id: ID!

  """
  What kind of teaching this part is: a lecture, a laboratory group, a seminar.
  """
  kind: InstancePartKind!

  """Order within the instance."""
  position: Int!

  """
  What a **lecturer** is credited with for holding this part.
  
  Starts as what the module's split says and is editable afterwards: the two are different
  quantities that merely begin equal. `null` while nobody has stated it, which is a normal state
  for an instance declared before the detail was settled.
  """
  teachingHours: Float

  """
  This part is held once and serves the other cohorts of the same module as well.
  
  The shared lecture: one person gives it for IF3A and IF3B, it happens once, and its hours count
  once — here, at the cohort that owns the row. Not the default and never automatic: a cohort
  holds its own teaching unless somebody says otherwise, because sharing by default would make
  the faculty's hours look smaller than they are until somebody noticed.
  """
  sharedAcrossTracks: Boolean!
}

"""
One assignable unit of teaching.

The same vocabulary describes a module's canonical split and the parts an actual offering runs,
because the second is made from the first. Two lists that had to agree without a compiler saying
so would drift.
"""
enum InstancePartKind {
  """
  A lecture. The part that can be held once for several parallel cohorts.
  """
  LECTURE

  """A laboratory group. Usually the part that exists several times over."""
  LAB

  """An exercise group."""
  EXERCISE

  """A seminar group."""
  SEMINAR

  """A project group."""
  PROJECT

  """Anything the five above do not name."""
  OTHER
}

"""
An entry in the module catalogue.

Modules are **not** what gets planned — instances are. A module is the catalogue entry an
instance is an offering of, and it survives a change of regulations: measured against the
source, a module keeps its identity across up to 19 sets of regulations and 9 programmes.
"""
type Module {
  id: ID!

  """
  The name, which is empty for a handful of modules.
  
  The examination office's module records carry no name field at all — the name exists only
  inside an association with a set of regulations, so a module that appears in none has none
  anywhere. Kept and rendered by its identifier rather than hidden, because the person
  responsible for it has to be able to find it.
  """
  name: String!

  """The programme that plans this module. Every module has exactly one."""
  homeProgramme: Programme!

  """
  Who the examination office names as responsible for this module, or `null`.
  
  Null for about one module in thirty, and for two different reasons that are not
  distinguished here: the source names a placeholder rather than a person, or it names an
  address that is not in the teacher list. Both appear on the import page, where the raw value
  is; it is deliberately not carried here, because a mail address belongs in the type about
  people rather than in the one about modules.
  """
  responsible: Teacher

  """How the teaching is broken up, as the catalogue describes it."""
  courseType: CourseType!

  """How often it runs."""
  frequency: Frequency!

  """
  Contact hours a **student** attends per week, as the catalogue states them.
  
  **Not teaching load.** The teaching held for one instance is the sum over its parts and is
  routinely larger: a four-hour module running one lecture and three laboratory groups costs the
  faculty eight hours. Summing this field is the plausible-looking wrong answer.
  """
  contactHoursPerWeek: Int

  """ECTS credits, as the catalogue states them."""
  credits: Int

  """
  False for a module the examination office has retired but still publishes.
  
  Distinct from a module it has stopped publishing altogether, which is `retiredAt`.
  """
  active: Boolean!

  """False for a module the examination office has not made official."""
  official: Boolean!

  """
  When a successful import stopped mentioning this module, or `null`. Modules are never deleted.
  """
  retiredAt: Time

  """
  The examination office's identifier, for cross-referencing.
  
  Information, never an argument. Making an imported identifier the thing external scripts key
  on is the mistake the whole import layer is arranged to avoid — undoing it later would mean
  changing somebody else's script rather than this schema.
  """
  zpaId: String

  """
  How the module's hours divide between teachable units — two of lecture and two of laboratory,
  say.
  
  **Empty means nobody has stated it yet**, and that is a normal state rather than an error: the
  examination office publishes one total and no split, so this is the faculty's own knowledge.
  An instance cannot be declared for a module whose split is empty, because the parts of the
  instance are made from these.
  """
  components: [ModuleComponent!]!

  """
  The sum of the components, or `null` while there are none. Compare with `contactHoursPerWeek`.
  """
  componentHours: Float

  """
  Where this module counts: one entry per version of a programme's regulations.
  
  The union over every programme and version, unfiltered. A module dropped from the newest
  version of one programme's regulations is still being taught to the students of the older one.
  """
  offerings: [ModuleOffering!]!

  """
  Compulsory or elective in one programme, folded over every version of its regulations, or
  `null` if the module does not appear in that programme's catalogue at all.
  
  `MIXED` is the honest answer where the versions disagree, which happens.
  """
  dutyStatus(
    """The programme's short code."""
    programme: String!
  ): DutyStatus

  """
  Whether this module appears in the named programme's catalogue.
  
  `false` together with a `homeProgramme` of that programme is a real and common state — the
  module is the programme's own and does not currently count in any version of its regulations.
  Twenty-six active modules are in it, which is why a programme's module list is the union of its
  catalogue and its own modules rather than the catalogue alone.
  """
  inCatalogue(
    """The programme's short code."""
    programme: String!
  ): Boolean!
}

"""
How one module's hours divide between teachable units.

Stated once per module by the people who know it, and stable — a new version of the regulations
does not change it. The examination office publishes one figure per module and a phrase
describing the breakdown; whether four hours are two of lecture and two of laboratory, or three
and one, exists nowhere in the source.
"""
type ModuleComponent {
  id: ID!

  """What kind of teaching this unit is."""
  kind: InstancePartKind!

  """
  Hours per week for **one** unit of this kind.
  
  A module with two hours of laboratory has one entry saying two, however many parallel groups
  an instance later runs — the multiplicity belongs to the instance.
  """
  teachingHours: Float!

  """Order within the module."""
  position: Int!
}

"""One unit of a module's split, on the way in."""
input ModuleComponentInput {
  """What kind of teaching this unit is."""
  kind: InstancePartKind!

  """Hours per week for one unit of this kind. Greater than zero."""
  teachingHours: Float!
}

"""
Which modules to list.

An input type rather than separate arguments, unlike `people(search:, includeInactive:)`
elsewhere in this schema: six filters is past the point where positional arguments read, the set
will grow as subject groups and competences arrive, and an interface's form maps onto it field
for field.
"""
input ModuleFilter {
  """
  Relevant for this study programme, by its short code.
  
  Two things at once, and the second half is not redundant: the module counts in one of the
  programme's sets of regulations, **or** the programme is its home. Twenty-six active modules
  are only reachable through the second half, ten of them in the faculty's largest programme —
  and the first thing somebody does is look for a module they are responsible for.
  """
  programme: String

  """
  Narrow to one version of the regulations.
  
  No default, deliberately. Unfiltered, a programme's list is the union over every version it
  has: a module dropped from the newest one is still being taught to the students of the older.
  """
  spo: ID

  """
  Keep only modules with one of these frequencies.
  
  To find what could run in a winter semester, ask for `EVERY_WINTER_SEMESTER`,
  `EVERY_SEMESTER`, `ALTERNATING_WITHIN_SUBJECT_GROUP`, `ON_ANNOUNCEMENT` and `UNKNOWN` — the
  last three say nothing about the term and are together more than half the catalogue, so
  leaving them out hides far more than it removes.
  """
  frequency: [Frequency!]

  """
  Compulsory or elective. Requires `programme`, and is ignored without it — the answer is a
  property of a module *in a programme*, not of a module.
  """
  duty: DutyStatus

  """
  A substring of the name or of one of the module codes. Case-insensitive.
  """
  search: String

  """
  Include modules the examination office has retired. About a hundred of them.
  """
  includeInactive: Boolean = false

  """Only the modules this person is responsible for, by teacher id."""
  responsible: ID

  """
  Keep only modules whose hours have not been split into teachable units yet.
  
  The work list. A programme lead getting ready for a semester needs to know which of their
  modules cannot be declared yet, and that is a bounded, finishable task rather than an open
  form.
  """
  withoutComponents: Boolean = false
}

"""
This module counts in this version of these regulations.

One entry per module per version, folded from the catalogue slots the module sits in. Rebuilt
from the examination office's data on every import and never edited here: it is a statement
about somebody else's regulations, and an editable copy would be a second version of them that
nobody in the faculty is authorised to keep.
"""
type ModuleOffering {
  """The version of the regulations this module counts in."""
  spo: Spo!

  """Compulsory or elective, as the catalogue slot says."""
  isDuty: Boolean!

  """
  The codes this module carries in these regulations, possibly several.
  
  Display only, never an identifier. The code belongs to the module-regulations-slot triple
  rather than to the module: 85 module/version pairs carry more than one because the
  specialisation is inside the code, one module carries eight across the catalogue, and a fifth
  of the source rows carry none at all.
  """
  moduleCodes: [String!]!

  """The specialisations whose catalogue this module sits in."""
  focuses: [String!]!

  """
  The earliest programme semester a student may take it in.
  
  A floor, not a cohort year and not a timetable slot. Nearly half the source rows say 1, which
  for an elective means "no restriction".
  """
  minProgrammeSemester: Int
}

"""
Everything that changes something.

All of it is `@interactiveOnly` for now: writing happens in a signed-in browser session, not
through a Personal Access Token.
"""
type Mutation {
  """
  Create a Personal Access Token for yourself.
  
  The secret comes back once, in the response. Only in a signed-in browser session: through a
  token this fails with `INTERACTIVE_ONLY`, so that a leaked token cannot create its own
  successors.
  """
  createPersonalAccessToken(
    """
    What it is for, in your own words. Not secret — it is there so you recognise it later.
    """
    description: String!

    """
    How many days it should live. 90 if you leave this out, 365 at most, 1 at least.
    """
    expiresInDays: Int

    """
    What this token may reach. **Leave it out and the token is unrestricted** — it can do
    everything your roles allow.
    
    A scope only ever narrows. Listing `PLANNING: READ` gives you a token that reads the
    planning and nothing else, however much your roles would otherwise permit; it cannot give
    you anything you do not already hold.
    
    Which fields belong to which area is listed on `ScopeArea`. `WRITE` includes `READ` in the
    same area, so a token that reads and writes the planning needs one entry, not two.
    
    Fixed at creation. There is no way to change the scopes of an existing token — mint a new
    one and revoke this one, so that what the holder believes it can do and what it can do are
    never two different things.
    """
    scopes: [ScopeGrantInput!]
  ): CreatedPersonalAccessToken!

  """
  Withdraw one of your own tokens. Immediate, and there is no way back.
  
  Revoking a token that is already revoked changes nothing and is not an error. A token that
  does not exist and a token belonging to somebody else produce the same refusal.
  """
  revokePersonalAccessToken(id: ID!): PersonalAccessToken!

  """
  Add somebody to this installation.
  
  The mail address is all that is required, and it is the only thing that has to be right: it
  is what the login asserts, so it decides whether this person can sign in at all. The name
  can be filled in later, by them or by an import. Requiring it here would mean finding out
  how a new colleague spells their first name before their account can exist.
  
  A new person holds no roles. Even LECTURER is granted explicitly, so that who may do what is
  a list somebody wrote rather than a default nobody chose.
  """
  createPerson(mail: String!, name: String): Person!

  """Set somebody's display name."""
  renamePerson(id: ID!, name: String!): Person!

  """
  Bring somebody's roles to exactly this set.
  
  The whole set rather than add and remove, because that is what the screen shows and because
  add/remove loses to a race the moment two administrators have the same person open: the
  second one's stale view of what the first did would decide the outcome.
  
  `expiresAt` applies to the roles being *added*. Roles already held keep their own expiry
  unless they are re-granted, so re-sending an unchanged set does not silently extend
  anything.
  
  Refused with `LAST_ADMIN` when it would leave the installation with nobody who can
  administer it.
  """
  setPersonRoles(id: ID!, roles: [Role!]!, expiresAt: Time): Person!

  """
  Activate or deactivate somebody.
  
  Deactivating is the removal this system has: an inactive person fails authentication on both
  doors, so it withdraws their tokens in the same moment without touching a token row.
  
  Refused with `LAST_ADMIN` when it would deactivate the last administrator — that is the same
  refusal as taking their ADMIN away, because it has the same consequence.
  """
  setPersonActive(id: ID!, active: Boolean!): Person!

  """
  Set which study programmes somebody's leadership applies to.
  
  The whole set at once, like `setPersonRoles` and for the same reason: a per-programme mutation
  would let the two halves of a swap be separated, and in between somebody leads a programme
  nobody meant them to.
  
  The person has to hold `PROGRAMME_LEAD` already, or this is refused with
  `NOT_A_PROGRAMME_LEAD` — grant the role first. An unknown code is refused with
  `UNKNOWN_PROGRAMME` rather than silently dropped.
  
  An empty list is allowed and means they lead none. That is the state a fresh grant is in, and
  it is **not** "all of them": such a lead may declare no demand until somebody assigns them a
  programme. The refusal they meet says exactly that, so nobody goes asking for a role they
  already hold.
  """
  setPersonProgrammes(
    id: ID!

    """
    Short codes, for example `["IF", "IG"]`. Upper-cased and de-duplicated for you.
    """
    programmes: [String!]!
  ): Person!

  """
  State how a module's hours divide between teachable units.
  
  Replaces the whole split rather than editing one entry: the entries only mean anything
  together, and a per-entry mutation would allow a moment where a module's hours add up to
  something nobody intended.
  
  Allowed for the study programme lead of the module's **home** programme and for the dean's
  office. Not for a lead in whose catalogue the module merely counts — the module is planned
  where it is at home, and two programmes editing one split would disagree in the database.
  
  Passing an empty list clears the split, which makes the module undeclarable again. That is
  allowed on purpose: a split entered wrongly should be removable by the person who entered it.
  """
  setModuleComponents(
    moduleId: ID!

    """In order. At least one entry, or none at all to clear the split."""
    components: [ModuleComponentInput!]!
  ): Module!

  """
  Declare that a study programme needs this module in this semester, for this cohort.
  
  Allowed for the lead of **that** programme and for the dean's office — and in every phase,
  including `FINAL`. An instance declared during the assignment is a correction, and corrections
  happen; a tool that refuses one moves it into a spreadsheet passed around by mail.
  
  The parts are made from the module's split, one per unit, each credited with the hours the
  split states. A module with no split is refused with `MODULE_NOT_DECOMPOSED`.
  
  Declaring the same cohort twice is `TRACK_TAKEN`.
  """
  declareCourseInstance(input: DeclareCourseInstanceInput!): CourseInstance!

  """
  Copy an instance to a second parallel cohort — IF1 becomes IF1A and IF1B.
  
  `sourceTrack` renames the original in the same act, and that is why this is one mutation rather
  than two: a single cohort becoming two is one decision, and doing it in two steps leaves a
  moment in which the pair does not look like a pair and every label is wrong.
  
  A part that is already held for the sibling cohorts is **not** copied — it already serves the
  new one, and copying it would be the same lecture twice with its hours counted twice.
  """
  duplicateCourseInstance(
    id: ID!

    """
    The new cohort's letter. Required: without one the copy would collide with its own source.
    """
    track: String!

    """
    What the source cohort should be called from now on. Omit to leave it as it is.
    """
    sourceTrack: String
  ): CourseInstance!

  """
  Change the two editable things about an instance: its cohort and its cohort year.
  
  The module, the programme and the semester are not among them. Changing one of those is not an
  edit of this instance — it is a different instance, and the parts, and later the wishes, belong
  to the one that was declared.
  """
  changeCourseInstance(id: ID!, track: String!, programmeSemester: Int): CourseInstance!

  """
  Withdraw an instance that is not needed after all. Its parts go with it.
  
  Refused with `INSTANCE_IN_USE` once anything hangs off it. That refusal deliberately says
  nothing about *what* — no count, no kind of thing named. The first table to point at an
  instance part will be the wish table, and "this instance has three wishes" is the confidential
  fact with the names taken out.
  
  Returns the id of the withdrawn instance, so that a list can drop it without asking again.
  """
  withdrawCourseInstance(id: ID!): ID!

  """
  Add a part to an instance — the second laboratory group, the tutorial nobody planned for.
  
  This is how the multiplicity of a module's split is expressed. The split says a laboratory is
  two hours; how many groups of it a cohort runs is a planning decision and belongs here.
  """
  addInstancePart(
    instanceId: ID!
    kind: InstancePartKind!

    """What a lecturer is credited with. Omit while it is not settled."""
    teachingHours: Float
  ): CourseInstance!

  """Correct a part's kind or hours."""
  changeInstancePart(id: ID!, kind: InstancePartKind!, teachingHours: Float): CourseInstance!

  """
  Remove a part. Refused with `INSTANCE_IN_USE` once anything hangs off it.
  """
  removeInstancePart(id: ID!): CourseInstance!

  """
  Hold this part once for all the parallel cohorts of its module.
  
  The shared lecture: one person gives it for IF3A and IF3B, it happens once, and its hours count
  once. The sibling cohorts' own parts of the same kind are removed in the same act — a database
  in which only the flag was written has a cohort attending two lectures.
  
  Refused with `NO_SIBLING_TRACKS` where there is no second cohort to share with, and with
  `INSTANCE_IN_USE` if one of the parts that would go is already spoken for.
  """
  shareInstancePartAcrossTracks(id: ID!): CourseInstance!

  """
  Undo that: every cohort holds its own again, with the same hours.
  
  As easy as the merge on purpose, because sharing is a judgement that gets revised — the person
  who was going to give both lectures is on sabbatical. A cohort that already has a part of that
  kind is left alone rather than given a second one.
  """
  splitInstancePartAcrossTracks(id: ID!): CourseInstance!

  """
  Declare in one semester what the same programme declared in another.
  
  What it carries over is the previous semester's *instances and their parts*, not the modules'
  splits — so the number of laboratory groups, which is a planning decision somebody made last
  year, comes with it. That is the difference between this and declaring each instance by hand,
  and the reason it exists.
  
  Instances already declared in the target are left untouched and counted as skipped. A shared
  lecture stays shared, because its sibling cohort is copied too.
  
  The permission is about the **target** semester: what is being written is next year's demand.
  """
  copyDemandFromSemester(
    """The semester to copy from."""
    from: String!

    """The semester to copy into."""
    to: String!

    """The study programme, by its short code."""
    programme: String!
  ): CopyDemandReport!

  """
  Move a semester one step through the process, forwards or backwards.
  
  Only to an adjacent phase — see `reachablePhases`. A semester nobody has touched is in
  `DEMAND_PLANNING`, so this works on any semester within reach without anything having to be
  set up first. If somebody else switched it between your reading it and this call, you get
  `PHASE_MOVED_ON` and nothing changes.
  
  The code is upper-cased and trimmed for you, so `2026-ws` is accepted. It is not otherwise
  repaired: `WS 2026` is refused rather than rearranged — that spelling is only unambiguous if
  one already knows the year names the term's *start*, and a wrong guess there would record a
  decision about a semester one year out that looks like one somebody chose.
  """
  advanceSemesterPhase(
    """Four digits, a hyphen and SS or WS, for example `2026-WS`."""
    code: String!
    to: Phase!
  ): Semester!

  """
  End the confidentiality window: make the wishes of this semester visible to everybody.
  
  **There is no way back.** Calling it twice is not an error and does not move the timestamp.
  
  Only in a signed-in browser session: through a Personal Access Token this fails with
  `INTERACTIVE_ONLY`.
  """
  publishWishes(code: String!): Semester!

  """
  Fetch the module master data now and apply it.
  
  Refused if a run is already going — the one in progress is returned instead of a second one
  being started — and refused for a while after a successful run, because this reaches into
  another institution's system and a button that can be held down should not be able to hammer
  it.
  
  Interactive only. It is an outbound call using a shared credential, and the record of who
  asked for it should be a person who signed in rather than a token in a script.
  """
  syncZpaNow: ZpaSyncRun!

  """
  Rebuild the module catalogue from the payloads already cached, without fetching anything.
  
  For when the rules of the projection change: a new rule has to be applicable to data already
  held, without waiting for the nightly job and without asking another institution's system for
  3861 objects that have not moved.
  
  Unlike `syncZpaNow` this reaches nothing outside this database, so there is nothing to hammer
  and no cooling-off period. Interactive only all the same — it rewrites the catalogue everybody
  plans with, and that should be attributable to somebody who signed in.
  """
  projectZpaCatalogue: ZpaCatalogueProjection!
}

"""
A person in the planning.

Carries identity and roles, nothing else. Teaching load and notes about people are not
reachable here — see the `@interactiveOnly` note in the API documentation.
"""
type Person {
  id: ID!

  """
  The address the university's login asserts. Case-insensitive, and the key we match on.
  """
  mail: String!
  name: String!

  """The roles this person holds, in a stable order."""
  roles: [Role!]!

  """
  The study programmes this person's study-programme leadership applies to.
  
  Empty for everybody who does not lead one — and empty for a lead nobody has assigned a
  programme to yet, which is a state with consequences rather than a gap: such a lead may
  declare no demand at all. An empty list here is **not** "every programme". The role leads
  one; the role that means all of them is the dean's office.
  
  Readable through both doors, like `roles`: which programmes you may plan is the first thing a
  script needs to know, and on `me` it is your own data.
  """
  programmes: [Programme!]!
}

"""
A Personal Access Token, as its owner sees it.

The secret is not here and never will be: the server keeps only a checksum of it, so no query
can hand it out a second time.
"""
type PersonalAccessToken {
  """
  The public half of the token — the part between the two underscores in `tallox_…_…`.
  
  Safe to write down, safe to read out over the phone. It identifies the token in this list
  and in the audit log, and it is what you pass to `revokePersonalAccessToken`.
  """
  id: ID!

  """
  What you called it. Shown in the list, so that revoking the right one is not guesswork.
  """
  description: String!

  """
  The `area:verb` grants this token carries — see the `@scope` directive.
  
  **An empty list means unrestricted**: the token may do everything its owner's roles allow.
  Scopes only ever narrow. There is currently no way to choose them when creating a token, so
  in practice this list is empty; the enforcement is live, and tokens created now keep working
  when the choice arrives.
  """
  scopes: [String!]!
  createdAt: Time!

  """
  When this token stops working. There is no token without an expiry: 90 days by default, 365
  at most.
  """
  expiresAt: Time!

  """
  Roughly when the token was last used, or `null` if it never was.
  
  Deliberately coarse — it is only updated when the previous value is more than five minutes
  old. It answers "is this still in use, can I revoke it", which is what it is for.
  """
  lastUsedAt: Time

  """When it was withdrawn, or `null` while it still works."""
  revokedAt: Time
}

"""
Where a semester stands in the planning process.

The phase is stored and switched deliberately, never derived from the calendar. Dates slip,
and a process that moves on because a Tuesday arrived is one nobody trusts — this way the
switch is an act somebody performs, visibly and at a moment everyone can point at.

A semester moves **one step at a time**, forwards or backwards. Backwards is the correction:
reopening a plan is a normal thing for a faculty to do, and it should happen in the tool rather
than around it.
"""
enum Phase {
  """The programme leads declare which instances have to be offered."""
  DEMAND_PLANNING

  """
  Lecturers register interest. Entries are confidential until they are published
  — which is a separate decision, see `wishesPublishedAt`.
  """
  WISHES

  """The subject group leads fill the instances."""
  ASSIGNMENT

  """The plan stands. Changes from here on are corrections, not planning."""
  FINAL
}

"""One rule, and what it answers for this person."""
type PolicyDecision {
  """
  The rule, named as it is named in the source — so that a report can be acted on.
  """
  rule: String!

  """What the rule answers for this person right now."""
  allowed: Boolean!

  """
  Why, in a sentence somebody without the source in front of them can use.
  """
  reason: String!
}

"""
A study programme of the faculty.

Addressed by its short code — IF, IG, DA, DC — which is the name the faculty says out loud and
the examination office publishes. The same argument `Semester.code` makes: short, stable, and
belongs in a URL and in a colleague's script.
"""
type Programme {
  """IF, IG, DA, DC. Upper case, at most ten characters."""
  code: String!

  """
  The long name, maintained here rather than imported.
  
  The examination office publishes no long name — the field that looks like one carries the code
  again — so this is written by a person and the nightly import never touches it. Empty until
  somebody types one, and an interface should fall back to the code.
  """
  title: String!

  """
  False for a programme the examination office publishes no current regulations for.
  
  One such programme exists. Its modules are still planable, which is why it is here at all
  rather than treated as a data error; it simply does not belong in a picker.
  """
  active: Boolean!

  """Its versions of the examination regulations, newest first."""
  spos: [Spo!]!
}

"""
Everything that can be read.

Start with `me` to check that your token works and to see which roles you hold — the roles
decide what the rest of these fields answer.
"""
type Query {
  """
  Which version of the server is answering.
  
  Works without authentication, so it is also the simplest way to check that a token, a
  network route or a proxy is doing what you expect: if this answers and nothing else does,
  the problem is the credential and not the connection.
  """
  buildInfo: BuildInfo!

  """
  Everybody this installation knows.
  
  `search` matches a substring of the mail address or the name. `includeInactive` brings back
  the people who have been deactivated; they are hidden by default because the list is
  otherwise mostly leavers after a few years.
  """
  people(search: String, includeInactive: Boolean): [Person!]

  """One person, or `null` if there is nobody with that id."""
  person(id: ID!): Person

  """
  One person's role grants, expired ones included.
  
  Separate from `Person.roles`, which is the set in force right now. The two answer different
  questions and merging them would lose the one this is for.
  """
  roleGrants(personId: ID!): [RoleGrant!]

  """
  Why a given person sees what they see.
  
  Takes the mail address rather than an id, because the question arrives as "Kollegin X says
  she cannot see the demand planning" and the address is what the asker has.
  """
  diagnoseAccess(mail: String!): AccessDiagnosis

  """
  Every study programme, by code.
  
  Includes the one with no current regulations, marked `active: false`, because its modules are
  still planable.
  """
  programmes: [Programme!]!

  """
  One study programme by its short code, or `null` if there is no such programme.
  """
  programme(code: String!): Programme

  """
  The module catalogue, filtered.
  
  Requires an account and no particular role: the catalogue is published by the examination
  office and a lecturer has to see a module before they can register interest in it.
  """
  modules(filter: ModuleFilter): [Module!]!

  """One module by its id, or `null`."""
  module(id: ID!): Module

  """
  The people who teach, as the examination office publishes them.
  
  Not the users of this installation — see `Teacher`. Readable by anybody with an account: it
  is who teaches at the faculty, and a lecturer looking for the person responsible for a
  module needs it.
  """
  teachers(
    """Substring of the name or of the address. Case-insensitive."""
    search: String

    """Include the ones the examination office marks as no longer teaching."""
    includeInactive: Boolean = false
  ): [Teacher!]!

  """
  The demand of a semester: which instances have been declared, with their parts.
  
  The semester is required and has no default. Without one this would be a question about every
  semester at once, which is not a screen anybody wants and is a large answer to produce by
  accident.
  """
  courseInstances(
    """Four digits, a hyphen and SS or WS, for example `2027-SS`."""
    semester: String!

    """
    One study programme, by its short code. Omit for every programme's demand in that semester.
    """
    programme: String

    """One module, across its cohorts."""
    module: ID
  ): [CourseInstance!]!

  """One course instance by its id, or `null`."""
  courseInstance(id: ID!): CourseInstance

  """
  Who you are, as far as this server is concerned — or `null` if you are not signed in.
  
  The field to start with when writing a script: getting a person back means the token is
  valid, its owner is active, and these are the roles the rest of your queries will be judged
  by. It is the same field the web interface uses, so it cannot answer differently there.
  """
  me: Person

  """
  The semesters worth showing, newest first.
  
  The ones near now — a year back and three years forward — plus every semester anybody has
  already decided something about, however far out it lies. A plan made for five years ahead
  took a deliberate act to record and is exactly the one that must not fall off the list.
  
  The calendar decides what is *offered* here and nothing else; the phase of each one is still
  a decision somebody made. Use `semester(code:)` for anything outside this window.
  
  Requires a signed-in identity — like everything except `buildInfo` — but no particular role:
  which semester is in which phase is the answer to "may I enter my wishes yet", and hiding it
  would produce a tool that refuses writes without saying why.
  """
  semesters: [Semester!]!

  """
  One semester by its code — always an answer, never `null`.
  
  There is no "no such semester": `2031-SS` names a stretch of time that will happen, and
  saying it does not exist would be false in the ordinary sense of the word. Only a malformed
  code (`SEMESTER_CODE_INVALID`) or one more than ten years from now
  (`SEMESTER_OUT_OF_RANGE`) is refused.
  """
  semester(code: String!): Semester!

  """
  How this request is being judged: identity, effective roles, and whether they were narrowed.
  
  Answers for anonymous callers too, with `person: null` and no roles — the interface renders
  a signed-out state from it rather than from a failed query.
  """
  session: Session!

  """
  Your own tokens. Never anybody else's.
  
  `null` through a Personal Access Token — see `@interactiveOnly`. The rest of the query still
  answers, so this field can be asked for speculatively without breaking anything.
  """
  myTokens: [PersonalAccessToken!]

  """
  The recent import runs, newest first.
  
  The one worth looking at is the most recent **successful** one and how long ago it was. The
  failure this import will actually have is not a wrong result — it is a job that quietly
  stopped weeks ago, while everything looks healthy and the planning uses stale data.
  """
  zpaSyncRuns(limit: Int = 20): [ZpaSyncRun!]!

  """One import run, or `null` if there is no such run."""
  zpaSyncRun(id: ID!): ZpaSyncRun

  """What one run changed."""
  zpaChanges(runId: ID!): [ZpaChange!]!

  """
  The recent rebuilds of the module catalogue, newest first.
  
  Worth looking at beside `zpaSyncRuns` rather than instead of it. A successful import with a
  failed projection means fresh payloads behind a stale catalogue, and only this field says so.
  """
  zpaCatalogueProjections(limit: Int = 20): [ZpaCatalogueProjection!]!
}

"""
A role somebody holds. Everybody holds `LECTURER`; the others come on top of it.

The values are English. The interface shows the German terms the faculty uses: Dozent:in,
Fachgruppenleitung, Studiengangsleitung, Dekanat.
"""
enum Role {
  """
  Teaches, keeps a profile and a competence profile, registers interest in instances.
  """
  LECTURER

  """Assigns the instances of one subject group."""
  SUBJECT_GROUP_LEAD

  """
  Declares the demand of one study programme: which instances are needed, and the catalogues.
  """
  PROGRAMME_LEAD

  """
  Reads across programmes for the import/export statistics, keeps the teaching-load traffic light.
  """
  DEANS_OFFICE

  """
  Administers people, roles and tokens. Not a reader of unpublished wishes.
  """
  ADMIN
}

"""
One role grant, as stored — including one that has already expired.

Deliberately unfiltered, unlike `Person.roles`. "DEANS_OFFICE, granted on Tuesday by X,
expired on Wednesday" is the answer to the only question this record gets asked: who could see
what, and when.
"""
type RoleGrant {
  """The role that was granted."""
  role: Role!

  """
  When it was granted. Refreshed when the same grant is re-issued with a new expiry.
  """
  grantedAt: Time!

  """
  Who granted it, or `null` for a grant no human decided — the reconciliation of the
  protected administrators from the configuration file, or a future import.
  """
  grantedBy: Person

  """
  When it stops taking effect, or `null` if it does not expire.
  
  A grant with a date on it is how somebody steps over a threshold and has the database step
  back over it for them. The intended use is "let me look at this until this evening", not a
  way to hold a role for a semester — a grant meant to last that long should be visible as a
  permanent one rather than as a date nobody rereads.
  """
  expiresAt: Time
}

"""
The part of the API a scope refers to.

Deliberately coarse: these are meant to be ticked in a dialog by somebody whose mind is on the
evaluation script they are about to write.
"""
enum ScopeArea {
  """
  What answers without an identity. Useful for checking that a route and a credential work
  when everything else is refused: if this answers and nothing else does, the problem is the
  token and not the connection.
  
  **A scope list cannot take this away.** What is behind it answers without any credential, so
  a token scoped away from it would reach less than an anonymous caller — and would lose the
  one field that tells a broken credential from a broken route. Listing it is never necessary.
  
  Fields: `buildInfo`.
  """
  PUBLIC

  """
  Your own identity and session: who you are, which roles you hold, and which of them you are
  being judged by.
  
  Fields: `me`, `session`.
  """
  PROFILE

  """
  The planning process: which semesters exist, where each one stands, and — as they arrive —
  the demand, the assignments and the statistics.
  
  The first area worth narrowing a token to. `PUBLIC` and `PROFILE` are you describing
  yourself; `TOKENS` and `ADMIN` are unreachable through a token at all.
  
  Fields: `semesters`, `semester`, `programmes`, `programme`, `modules`, `module`, `teachers`,
  `courseInstances`, `courseInstance`, `advanceSemesterPhase`, `publishWishes`,
  `setModuleComponents`, `declareCourseInstance`, `duplicateCourseInstance`,
  `changeCourseInstance`, `withdrawCourseInstance`, `addInstancePart`, `changeInstancePart`,
  `removeInstancePart`, `shareInstancePartAcrossTracks`, `splitInstancePartAcrossTracks`,
  `copyDemandFromSemester`.
  """
  PLANNING

  """
  Personal Access Token management. Not reachable through a token at all — those fields are
  `@interactiveOnly`, so that a leaked token cannot mint its successors.
  
  Fields: `myTokens`, `createPersonalAccessToken`, `revokePersonalAccessToken`.
  """
  TOKENS

  """
  Running the installation: user and role administration, and the module import. Also
  `@interactiveOnly`, for the same reason.
  
  The import is here rather than under `PLANNING` because what these fields expose is the
  operation — did the nightly job run, what did it change, run it now, what did it make of the
  untidy parts — and not the catalogue it produces. The catalogue itself is planning data and
  lives under `PLANNING`. An area of its own was considered and rejected: every field it could
  hold is unreachable through a token anyway, so it would be a promise in an enum that
  colleagues can read via introspection and never use.
  
  Fields: `people`, `person`, `roleGrants`, `diagnoseAccess`, `createPerson`, `renamePerson`,
  `setPersonRoles`, `setPersonActive`, `setPersonProgrammes`, `zpaSyncRuns`, `zpaSyncRun`,
  `zpaChanges`, `zpaCatalogueProjections`, `syncZpaNow`, `projectZpaCatalogue`.
  """
  ADMIN
}

"""One `area: verb` pair, when creating a token."""
input ScopeGrantInput {
  """
  Which part of the API. The fields belonging to each area are listed on `ScopeArea`.
  """
  area: ScopeArea!

  """
  `READ` for queries, `WRITE` for mutations — and `WRITE` includes `READ` in the same area.
  """
  verb: ScopeVerb!
}

"""Whether a scope permits reading or changing."""
enum ScopeVerb {
  """Queries."""
  READ

  """
  Mutations — and queries in the same area, because a token that may change
  something and not look at it is not a capability anybody wants.
  """
  WRITE
}

"""
One semester, and where its planning stands.

**Nobody creates a semester.** It is a name for a stretch of time and it is there the way next
March is there — `semesters` lists the ones near now, and every code within reach can be asked
about. What gets created is a *decision* about one: switching its phase, publishing its wishes.
A semester nobody has decided anything about is in `DEMAND_PLANNING` with its wishes
confidential, which is the start of the process and needs no act to arrive at.
"""
type Semester {
  """
  The semester in the form `2026-WS` or `2026-SS`: four digits, a hyphen and the term.
  
  The digits are the year the term *starts* in, so the winter semester 2026/27 is `2026-WS`.
  This is the spelling the faculty already uses — the examination office writes `WS 2026`, and
  the hyphen is here because a space has to be quoted in a URL, a filename or a shell argument.
  
  Sorts chronologically as plain text (`2026-SS` < `2026-WS` < `2027-SS`), which is why it is
  worth having in a filename or a script rather than the id.
  """
  code: String!

  """Where the planning stands."""
  phase: Phase!

  """
  The phases this semester can be switched to right now — one step away, in either direction.
  
  Computed from the same rule the mutation enforces, so an interface can render exactly the
  buttons that will work.
  """
  reachablePhases: [Phase!]!

  """
  When the wishes of this semester became visible to everybody, or `null` while they are still
  confidential.
  
  Separate from the phase on purpose, and not tied to it: the wish phase can end without
  publishing, so that late entries stop while the planners work, and publication can happen
  while the assignment is already running.
  
  There is no un-publishing. Once colleagues have seen each other's entries, clearing this
  would only be a lie about it.
  """
  wishesPublishedAt: Time

  """
  When the last decision about this semester was recorded, or `null` while none has been.
  
  Not "when the semester was created" — nothing creates one. It is the phase switch or the
  publication that this timestamp belongs to, and `null` means the semester is simply sitting
  in the calendar, untouched. A repeated `publishWishes` does not move it.
  """
  decidedAt: Time
}

"""
How the current request is being judged.

Read this rather than `me` when the question is "what may I do right now": it accounts for a
role narrowing, which `me` deliberately does not.
"""
type Session {
  """
  Who you are, or `null` if you are not signed in. The same value as the `me` query.
  """
  person: Person

  """
  The roles this request is actually judged by.
  
  Equal to `grantedRoles` unless you asked to be narrowed. This is the list an interface
  should render its navigation from.
  """
  effectiveRoles: [Role!]!

  """
  The roles you hold, whatever you are currently being judged by.
  
  What you get back by ending the narrowing — which is why the control that ends it must not
  itself be hidden by the narrowing.
  """
  grantedRoles: [Role!]!

  """
  Whether you asked to be judged by fewer roles than you hold.
  
  `true` means what you are looking at is a preview and not your own view. Say so visibly:
  somebody who forgets they are narrowed will eventually report a missing feature as a bug.
  """
  narrowed: Boolean!

  """
  Whether this is a signed-in browser session rather than a Personal Access Token.
  
  `false` means the `@interactiveOnly` fields will answer `null` — worth checking before
  concluding that something is empty.
  """
  interactive: Boolean!
}

"""
One version of one study programme's examination regulations.

Present in this schema because a module counts *in* one, and because narrowing the catalogue to
one version is a useful question. It is deliberately **not** part of what identifies a course
instance — see `CourseInstance`.
"""
type Spo {
  id: ID!

  """The year, as the examination office numbers them: 2019, 2023, 2025."""
  version: Int!

  """The day this version starts applying."""
  validFrom: Date

  """
  The identifier the campus management system uses, for example `07-IF-2025`, or `null` while
  the version is still being entered.
  
  That emptiness is the only reliable signal that a version is unfinished, which matters because
  an unfinished one holds a fraction of its eventual modules and would otherwise look like a
  catalogue that lost most of them.
  """
  primussId: String

  """The study programme these regulations belong to."""
  programme: Programme!
}

"""
Somebody who teaches, as the examination office publishes them.

**Not a user of this installation.** Who may sign in is a separate, curated list — the people
administration — and importing this one grants nothing. The two are connected by the mail
address where both know it, which is also why a teacher the source gives no address for can
never be connected to anybody.
"""
type Teacher {
  id: ID!

  """The full name with its titles, as the examination office writes it."""
  name: String!

  """Surname first, for a list. Every one of them is in this form."""
  sortName: String!

  """
  The address, or `null` for the handful the source gives none for.
  
  Also the link to a person in this installation: where somebody with this address may sign
  in, that is the same human.
  """
  mail: String

  """Holds a professorship."""
  isProfessor: Boolean!

  """Teaches on a contract (Lehrbeauftragte:r)."""
  isLecturerOnContract: Boolean!

  """Holds an honorary professorship."""
  isHonoraryProfessor: Boolean!

  """Is staff. Not exclusive with the three above — somebody can be both."""
  isStaff: Boolean!

  """
  What the examination office says about the employment. Roughly four in five are true.
  
  Kept and shown rather than filtered on import: five of the people still named as responsible
  for a module are false here, and dropping them would leave those modules pointing at nobody
  for a reason nobody could see.
  """
  active: Boolean!

  """
  The faculty, where the source says one. Absent for more than half of them, so it is a hint
  and not a filter.
  """
  faculty: String

  """
  The last semester this person taught in, in this system's spelling — or `null` where the
  source says something that is not a semester.
  """
  lastSemester: String

  """
  Whether somebody with this address may sign in to Tallox.
  
  Derived from the address on every read rather than stored, so that somebody admitted this
  morning is connected to their own modules now rather than after the next import.
  """
  isUser: Boolean!
}

"""
A moment in time, as an RFC 3339 string — for example `2026-08-01T14:30:00+02:00`.

Always in Europe/Berlin, the timezone the planning runs in.
"""
scalar Time

"""One rebuild of the module catalogue out of the cached payloads."""
type ZpaCatalogueProjection {
  id: ID!

  """
  The import run that triggered this, or `null` for a projection somebody asked for on its own.
  
  Both happen: every successful import projects, and the rules of the projection change often
  enough that applying a new one to data already held has to be possible.
  """
  runId: ID

  """
  When it started. Written before the first statement, so a projection that crashed is still visible.
  """
  startedAt: Time!

  """When it ended, or `null` while it is still going."""
  finishedAt: Time

  """How it ended."""
  status: ZpaProjectionStatus!

  """How many study programmes were written."""
  programmesWritten: Int!

  """How many teachers were written."""
  teachersWritten: Int!

  """How many modules were written."""
  modulesWritten: Int!

  """
  How many entries of 'this module counts in these regulations' were written.
  """
  offeringsWritten: Int!

  """
  How many such entries were removed because the source stopped supporting them.
  
  The only thing a projection deletes, and it is safe because nothing points at one. A module
  that disappears keeps its row and gains a retirement date instead.
  """
  offeringsRemoved: Int!

  """Why it failed, or `null`."""
  error: String

  """What the projection made of the parts of the source that are not tidy."""
  notes: [ZpaProjectionNote!]!
}

"""
One line of a run's report.

Deliberately without the payloads. They are kept in the database for the durable answer months
later, but shipping two documents per line into a list is a great many bytes for a view that
renders field names.
"""
type ZpaChange {
  id: ID!

  """Which kind of object."""
  kind: ZpaObjectKind!

  """The object's identifier in the examination office's database."""
  zpaId: String!

  """
  A human-readable name, or `null` when the payload carries none.
  
  Modules have none today: their objects carry no name field at all, and the name exists only
  inside the nested object of an association row.
  """
  label: String

  """What happened to it."""
  change: ZpaChangeType!

  """
  The top-level fields whose content differs, for a change; empty otherwise.
  
  Field names only. This is what turns "the content differs" into something readable — "the
  hours per week and the person responsible changed" rather than two documents side by side.
  """
  changedKeys: [String!]!

  """When this was noticed."""
  detectedAt: Time!
}

"""What happened to one object in one run."""
enum ZpaChangeType {
  """Seen for the first time."""
  APPEARED

  """Already held, and its content differs."""
  CHANGED

  """
  A successful fetch no longer mentions it.
  
  Only ever recorded after a fetch that succeeded and returned something, so that one bad night
  cannot retire a whole catalogue.
  """
  DISAPPEARED

  """
  It had disappeared and is back. The same record, with the day it was first seen intact.
  """
  REAPPEARED
}

"""What kind of object the examination office's interface published."""
enum ZpaObjectKind {
  """
  A module in the catalogue, with its home programme, course type and credits.
  """
  MODULE

  """
  A catalogue slot inside one version of a programme's examination regulations — compulsory or
  elective, and possibly belonging to a specialisation.
  """
  BASKET

  """
  The association between a module, a set of examination regulations and a basket. The module
  code and the earliest programme semester live here rather than on the module, because both
  differ between the programmes a module appears in.
  """
  MSBA

  """One version of one programme's examination regulations."""
  SPO

  """
  Somebody who teaches. The list a module's responsible person is named from — and, alone
  among the five, an endpoint whose values are actually typed.
  
  Importing these grants nobody access: who may use this installation is a separate, curated
  list.
  """
  TEACHER
}

"""
One decision the projection made about input the examination office left untidy.

Every one of these is a decision with a reason, and none of them is a silent drop: a projection
that quietly discarded rows would be indistinguishable from a catalogue that never had them, and
the first person to notice would be a programme lead who cannot find a module they are
responsible for.
"""
enum ZpaProjectionFinding {
  """
  Skipped: the source names no home programme for the module, and every module has exactly one.
  """
  MODULE_WITHOUT_HOME_PROGRAMME

  """Skipped, with its modules: a programme code this system cannot store."""
  PROGRAMME_CODE_MALFORMED

  """
  Not projected: the association points at regulations the source no longer publishes.
  
  The largest of these by far, and mostly historical. There is no path from such a row to a
  programme, so it cannot become an entry in a module's list of where it counts.
  """
  ASSOCIATION_WITH_UNKNOWN_REGULATIONS

  """
  Kept, and marked inactive: a programme named only by the modules that call it home.
  
  Its modules stay planable, which is why it is kept at all rather than treated as an error.
  """
  PROGRAMME_WITHOUT_REGULATIONS

  """
  Kept with an empty name: the source's module records carry no name field, and this module
  appears in no set of regulations to borrow one from.
  """
  MODULE_WITHOUT_NAME

  """Kept and flagged: the examination office has retired the module."""
  MODULE_INACTIVE

  """
  Became `UNKNOWN`: a phrase for how often a module runs that this version does not recognise.
  """
  FREQUENCY_UNMAPPED

  """The same, for how the teaching is broken up."""
  COURSE_TYPE_UNMAPPED

  """
  Folded with the lower value: the catalogue slots of one set of regulations disagree about the earliest semester.
  """
  MIN_SEMESTER_CONFLICT

  """
  Not stored: the source names a responsible person the teacher list does not contain.
  
  About one module in thirty. Either a placeholder rather than a person, or the address of
  somebody who is not in the list. The value stays in the cached payload; carrying it into the
  catalogue would put a mail address in the tables about modules.
  """
  MODULE_RESPONSIBLE_UNKNOWN

  """
  Kept: somebody who teaches and for whom the source gives no address.
  
  The address is the link to somebody who signs in, so such a person can never be connected to
  one — worth seeing, not worth refusing.
  """
  TEACHER_WITHOUT_MAIL

  """
  The one that is an alarm rather than a note, and it should always be absent.
  
  A module's entry per set of regulations is folded from up to four catalogue slots, and that
  fold is only safe because the slots never disagree about compulsory-or-elective — measured at
  zero conflicts across the whole catalogue. If this appears, the fold has been picking an
  answer.
  """
  DUTY_CONFLICT
}

"""
One line of a projection's report: what it found, how often, and a few examples.

Counts and samples rather than a row per object. The useful sentence is "665 associations across
12 sets of regulations", and whoever wants to chase one needs a handful of identifiers rather
than all of them.
"""
type ZpaProjectionNote {
  """What was found."""
  finding: ZpaProjectionFinding!

  """How many objects it applies to."""
  count: Int!

  """
  Up to twenty examples: examination office identifiers, or the phrases that were not
  recognised, or the programme codes — whichever is the useful thing to look at for this
  finding.
  """
  sample: [String!]!
}

"""
How a projection of the catalogue ended.

Three values rather than the import's four. There is no `PARTIAL`: the whole projection is one
transaction, so either the catalogue moved or it did not.
"""
enum ZpaProjectionStatus {
  """Still going, or the process that started it did not finish."""
  RUNNING

  """The catalogue was rebuilt."""
  SUCCEEDED

  """Nothing was written. The catalogue is exactly as it was."""
  FAILED
}

"""One run of the module master data import."""
type ZpaSyncRun {
  id: ID!

  """What started it."""
  trigger: ZpaSyncTrigger!

  """
  The name of whoever asked for it, or `null` for the nightly job.
  
  A name rather than a `Person`, because that is all this answers: the question is "who set
  this off", not "tell me about them", and a link into the people graph from here would be a
  second route to person data with its own rules to get right.
  
  Only ever a person, never a token: asking for a run is an act with an effect outside this
  database, so it stays attributable to somebody who signed in.
  """
  startedBy: String

  """
  When it started. Written before the first fetch, so a run that crashed is still visible.
  """
  startedAt: Time!

  """When it ended, or `null` while it is still going."""
  finishedAt: Time

  """How it ended."""
  status: ZpaSyncStatus!

  """How many objects were fetched in total."""
  fetched: Int!

  """How many were seen for the first time, or came back after an absence."""
  appeared: Int!

  """How many already held objects had different content."""
  changed: Int!

  """How many a successful fetch stopped mentioning."""
  disappeared: Int!

  """Why it failed or was only partly applied, or `null`."""
  error: String

  """What each endpoint did."""
  kinds: [ZpaSyncRunKind!]!
}

"""What one endpoint did within a run."""
type ZpaSyncRunKind {
  """Which endpoint."""
  kind: ZpaObjectKind!

  """Whether this endpoint was applied."""
  status: ZpaSyncStatus!

  """How many objects it returned."""
  fetched: Int!

  """Why it failed, in the words the operator needs, or `null`."""
  error: String
}

"""How an import run ended."""
enum ZpaSyncStatus {
  """Still going, or the process that started it did not finish."""
  RUNNING

  """Every endpoint was fetched and applied."""
  SUCCEEDED

  """
  Some endpoints were applied and others failed.
  
  Not a failure: the ones that arrived are correctly up to date, and nothing belonging to an
  endpoint that failed was retired.
  """
  PARTIAL

  """Nothing was applied."""
  FAILED
}

"""What started an import run."""
enum ZpaSyncTrigger {
  """The nightly job."""
  SCHEDULE

  """Somebody asked for it."""
  MANUAL
}

