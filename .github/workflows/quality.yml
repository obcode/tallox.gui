name: quality

# The fast gate. Runs on every push and every PR, needs no backend and no browser.
# E2E lives in e2e.yml — separate, because this workflow is meant to give an answer in
# under two minutes and E2E brings up an entire stack.

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: check · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: check (svelte-check, blockierend)
        run: pnpm run check
      - run: pnpm run lint
      - name: unit tests mit Abdeckungsschwellen
        run: pnpm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - run: pnpm run build

  # The committed copy of the schema has to match the generated documents.
  #
  # The failure this catches: someone updates schema.graphql by hand or via
  # `update-schema` and forgets the codegen. The build stays green because the old generated
  # code still compiles — it just describes a schema that no longer exists, and the type
  # error only surfaces at runtime as an empty field.
  codegen:
    name: generierte Dokumente sind aktuell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run codegen
      - name: kein Unterschied zum Commit
        run: |
          if ! git diff --exit-code; then
            echo "::error::Die generierten GraphQL-Dokumente weichen vom Commit ab."
            echo "Führe 'pnpm codegen' aus und committe das Ergebnis."
            exit 1
          fi
