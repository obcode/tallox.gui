name: e2e

# End-to-end against a real stack: PostgreSQL → tallox.go → SvelteKit SSR → Chromium.
#
# A workflow of its own and not part of quality.yml, because something unusual happens here:
# this job also checks out the **backend repository** and builds it. That is the price of
# being able to check the one thing no test in either repository reaches on its own —
# whether GUI and backend actually work together.
#
# Specifically, this is about passing on the identity. The SSR process talks to the backend
# past the auth proxy and has to send X-Remote-User itself. If that breaks, every page
# renders anonymously — and looks perfectly normal doing so. A mock backend would not show
# this failure, because the mock would get whatever headers the test gives it.

on:
  push:
    branches: ['**']
  pull_request:
  # So that a backend change can trigger this stage without anything being committed
  # here: tallox.go sends a repository_dispatch as soon as its own gate is green.
  repository_dispatch:
    types: [backend-changed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tallox
          POSTGRES_PASSWORD: tallox
          POSTGRES_DB: tallox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tallox -d tallox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TALLOX_DB_URL: postgres://tallox:tallox@127.0.0.1:5432/tallox?sslmode=disable
      # The SSR process calls the backend directly, as it does container-internally in production.
      TALLOX_SERVER: http://127.0.0.1:8080/query

    steps:
      - name: checkout gui
        uses: actions/checkout@v7

      # The default is the state of main. A repository_dispatch from tallox.go sends its
      # commit along, so that this stage checks exactly the backend version that triggered
      # it — and not whichever one happens to be on main right now.
      - name: checkout backend
        uses: actions/checkout@v7
        with:
          repository: obcode/tallox.go
          ref: ${{ github.event.client_payload.sha || 'main' }}
          path: .backend

      - uses: actions/setup-go@v7
        with:
          go-version-file: .backend/go.mod
          cache-dependency-path: .backend/go.sum

      - name: build backend
        working-directory: .backend
        run: go build -o tallox .

      - name: start backend
        working-directory: .backend
        run: |
          ./tallox -addr 127.0.0.1:8080 > "${RUNNER_TEMP}/backend.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/backend.pid"

      - name: wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              echo "backend is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not become healthy within 60s"
          cat "${RUNNER_TEMP}/backend.log"
          exit 1

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Explicit, although `prepare` already does it on install: .svelte-kit/tsconfig.json is
      # pulled in by the root tsconfig via `extends`, and Playwright loads its config *before*
      # the webServer builds. If the file is missing, the run fails before the first test with
      # a stack trace from playwright/lib/common — a message that looks like a broken
      # Playwright and says nothing about SvelteKit. A pnpm that skips lifecycle scripts must
      # not be able to cause that.
      - name: svelte-kit sync
        run: pnpm exec svelte-kit sync

      # Chromium only. The app is for colleagues on office machines and tablets on campus, and
      # installing three browser engines triples the run time for a benefit this audience
      # does not get.
      - name: install chromium
        run: pnpm exec playwright install --with-deps chromium

      # The backend migrated on startup, so the tables exist now. The people are created by
      # globalSetup in playwright.config.ts — all this says is that psql has to be there for
      # it; on ubuntu-latest it is preinstalled.
      - name: e2e
        run: pnpm run test:e2e

      # On a failure the report is the only thing that makes it understandable without a
      # local reproduction — trace, screenshot and video are attached to it.
      - name: upload playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Without this a failed E2E run is often just "the page was empty", while the reason
      # is in the backend log.
      - name: backend log
        if: failure()
        run: cat "${RUNNER_TEMP}/backend.log"

      - name: stop backend
        if: always()
        run: kill "$(cat "${RUNNER_TEMP}/backend.pid")" || true
