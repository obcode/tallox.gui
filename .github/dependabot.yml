version: 2

# Version updates for all three sources of third-party code in this repository: npm
# packages (pnpm lockfile), actions in the pipeline, base images in the Dockerfile.
#
# The commit-message prefixes are not cosmetic: semantic-release derives the release from
# them (see ci.yml). A `chore` produces no release — and without a release docker.yml
# builds no image and dispatches no deploy. Anything that has to reach the server
# therefore has to be a `fix`.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # A grace period, so that a freshly published npm package does not land in the lockfile
    # the same day. Without it Dependabot opens PRs that pnpm then rejects on its own
    # (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION) — exactly what happened on 2026-07-30, see
    # PR #7. The three days are comfortably above pnpm's 24 hours. Majors get longer,
    # because the mistakes in a .0 release need time to surface.
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    # dependencies end up in the image via the prod-deps stage → `fix`.
    # devDependencies (vite, eslint, playwright …) do not → `chore`, no release.
    commit-message:
      prefix: fix(deps)
      prefix-development: chore(deps-dev)
    groups:
      # One PR per class instead of twenty. Majors stay separate on purpose — Svelte,
      # SvelteKit and Vite are not something to wave through in a pack.
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    # Actions have no SemVer, so only default-days applies. A subverted action is the
    # classic way into a CI pipeline — a week of distance is cheap.
    cooldown:
      default-days: 7
    # Changes the pipeline, not the shipped artefact → no release.
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    # Docker tags have no SemVer, so only default-days applies.
    cooldown:
      default-days: 7
    # The base image (`node:24-alpine`, in all three stages) is part of the shipped image
    # → a patch release, so that it actually gets rebuilt and rolled out.
    commit-message:
      prefix: fix(docker)
    # The runtime stage is the production image and belongs on an LTS line. Node 24 is
    # Active LTS until 2028-04-30. Neither alternative is:
    #
    #   Node 25 — never LTS, EOL since 2026-06-01
    #   Node 26 — LTS only from 2026-10-28
    #
    # This lives here rather than as a closed PR, because Dependabot reads a manually
    # closed PR only as "not this one version" and then offers the next lower major —
    # on 2026-07-30 that was the EOL Node 25 (PR #13), after PR #1 to 26 had been
    # closed. A downgrade as the result of a rejection is exactly what this rule prevents.
    #
    # LIFT FROM 2026-10-28: Node 26 is LTS then and this block can go.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker-images:
        patterns: ['*']
        update-types: [minor, patch]
